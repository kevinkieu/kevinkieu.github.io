name: Build Jarvis AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất cứ lúc nào

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Cài đặt JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🐘 Cài đặt Gradle Runner
      uses: gradle/actions/setup-gradle@v3

    - name: 📱 Tự động khởi tạo dự án Android WebView
      run: |
        mkdir -p android/app/src/main/java/com/kevinkieu/jarvisai
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi

        if [ -f "icon-512.png" ]; then
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        elif [ -f "icon-192.png" ]; then
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi

        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat << 'EOF' > android/settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "JarvisAI"
        include ':app'
        EOF

        cat << 'EOF' > android/gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > android/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.kevinkieu.jarvisai'
            compileSdk 34
            defaultConfig {
                applicationId "com.kevinkieu.jarvisai"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }
            buildTypes {
                release { minifyEnabled false }
                debug { debuggable true }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.10.0'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.microphone" android:required="false" />
            <application
                android:allowBackup="true"
                android:label="Jarvis AI"
                android:theme="@style/Theme.JarvisAI"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android/app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.JarvisAI" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">#2563EB</item>
                <item name="android:statusBarColor">#090D16</item>
                <item name="android:navigationBarColor">#090D16</item>
                <item name="android:windowBackground">#090D16</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#090D16">
            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="#090D16" />
        </FrameLayout>
        EOF

        cat << 'EOF' > android/app/src/main/java/com/kevinkieu/jarvisai/MainActivity.java
        package com.kevinkieu.jarvisai;

        import android.Manifest;
        import android.annotation.SuppressLint;
        import android.app.Activity;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.Window;
        import android.view.WindowManager;
        import android.webkit.PermissionRequest;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Toast;

        import androidx.annotation.NonNull;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;

        public class MainActivity extends AppCompatActivity {
            private static final String TARGET_URL = "https://kevinkieu.github.io/index.html";
            private static final int PERMISSION_REQ_CODE = 1001;
            private static final int FILE_CHOOSER_REQ_CODE = 1002;

            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;
            private long lastBackPressTime = 0;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                Window window = getWindow();
                window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
                window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                window.setStatusBarColor(0xFF090D16);
                window.setNavigationBarColor(0xFF090D16);
                setContentView(R.layout.activity_main);

                webView = findViewById(R.id.webview);
                setupWebView();
                checkAndRequestPermissions();

                if (savedInstanceState == null) {
                    webView.loadUrl(TARGET_URL);
                } else {
                    webView.restoreState(savedInstanceState);
                }
            }

            @SuppressLint("SetJavaScriptEnabled")
            private void setupWebView() {
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setMediaPlaybackRequiresUserGesture(false);
                settings.setUseWideViewPort(true);
                settings.setLoadWithOverviewMode(true);
                settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public boolean shouldOverrideUrlLoading(WebView view, String url) {
                        if (url.startsWith("https://kevinkieu.github.io") || url.startsWith("http://kevinkieu.github.io")) {
                            return false;
                        }
                        try {
                            Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                            startActivity(intent);
                            return true;
                        } catch (Exception e) {
                            return false;
                        }
                    }
                });

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        runOnUiThread(() -> request.grant(request.getResources()));
                    }

                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback,
                                                     FileChooserParams fileChooserParams) {
                        if (MainActivity.this.filePathCallback != null) {
                            MainActivity.this.filePathCallback.onReceiveValue(null);
                        }
                        MainActivity.this.filePathCallback = filePathCallback;
                        Intent intent = fileChooserParams.createIntent();
                        try {
                            startActivityForResult(intent, FILE_CHOOSER_REQ_CODE);
                        } catch (Exception e) {
                            MainActivity.this.filePathCallback = null;
                            return false;
                        }
                        return true;
                    }
                });
            }

            private void checkAndRequestPermissions() {
                String[] permissions = Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU
                        ? new String[]{ Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA }
                        : new String[]{ Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA, Manifest.permission.READ_EXTERNAL_STORAGE };

                boolean need = false;
                for (String p : permissions) {
                    if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                        need = true;
                        break;
                    }
                }
                if (need) ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILE_CHOOSER_REQ_CODE) {
                    if (filePathCallback == null) {
                        super.onActivityResult(requestCode, resultCode, data);
                        return;
                    }
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        if (data.getDataString() != null) {
                            results = new Uri[]{ Uri.parse(data.getDataString()) };
                        } else if (data.getClipData() != null) {
                            int count = data.getClipData().getItemCount();
                            results = new Uri[count];
                            for (int i = 0; i < count; i++) results[i] = data.getClipData().getItemAt(i).getUri();
                        }
                    }
                    filePathCallback.onReceiveValue(results);
                    filePathCallback = null;
                    return;
                }
                super.onActivityResult(requestCode, resultCode, data);
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    if (System.currentTimeMillis() - lastBackPressTime < 2000) {
                        super.onBackPressed();
                    } else {
                        Toast.makeText(this, "Nhấn Back lần nữa để thoát Jarvis AI", Toast.LENGTH_SHORT).show();
                        lastBackPressTime = System.currentTimeMillis();
                    }
                }
            }
        }
        EOF

    - name: ⚙️ Khởi tạo Gradle Wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: 🚀 Biên dịch file Android APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: 📦 Đổi tên file APK xuất bản
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk JarvisAI.apk

    - name: 📤 Tải file APK lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JarvisAI-Android-App
        path: JarvisAI.apk
        retention-days: 30

    - name: 🏷️ Tạo GitHub Release tải về
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "Jarvis AI APK v1.0.${{ github.run_number }}"
        body: "Tải file JarvisAI.apk bên dưới về điện thoại Android để cài đặt ứng dụng."
        files: JarvisAI.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
