name: Build Jarvis AI Android APK

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên tab Actions của GitHub
  # Chỉ tự động kích hoạt khi có thay đổi thực sự trong thư mục android/ (không build thừa khi sửa web)
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Cài đặt JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🐘 Cài đặt Gradle Runner
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: ⚙️ Khởi tạo Gradle Wrapper & Cấp quyền thực thi
      run: |
        cd android
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: 🏷️ Đồng bộ Version Code & Version Name với GitHub Release
      run: |
        sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/g' android/app/build.gradle
        sed -i 's/versionName "[^"]*"/versionName "1.1.${{ github.run_number }}"/g' android/app/build.gradle
        cat android/app/build.gradle | grep -E "versionCode|versionName"

    - name: 🚀 Biên dịch file Android APK
      run: |
        cd android
        ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

    - name: 📦 Đổi tên file APK xuất bản
      run: |
        if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          cp android/app/build/outputs/apk/release/app-release.apk JarvisAI.apk
        else
          cp android/app/build/outputs/apk/debug/app-debug.apk JarvisAI.apk
        fi

    - name: 📤 Tải file APK lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JarvisAI-Android-App
        path: JarvisAI.apk
        retention-days: 30

    - name: 🏷️ Tạo GitHub Release tải về
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.${{ github.run_number }}
        name: "Jarvis AI APK v1.1.${{ github.run_number }}"
        body: "Bản cập nhật v1.1 tích hợp cầu nối lưu file Native (MP3, WAV, JSON vào thư mục Download) và sửa giao diện TTS Studio Pro."
        files: JarvisAI.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
