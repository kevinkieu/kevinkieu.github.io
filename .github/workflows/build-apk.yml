name: Build Jarvis AI Android APK

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên tab Actions của GitHub
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Cài đặt JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🐘 Cài đặt Gradle Runner
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: 🔄 Đồng bộ mã nguồn Web mới nhất vào Android Assets
      run: |
        mkdir -p android/app/src/main/assets/js android/app/src/main/assets/css
        cp -f index.html manifest.json sw.js android/app/src/main/assets/ || true
        cp -f icon*.png android/app/src/main/assets/ || true
        cp -rf js/* android/app/src/main/assets/js/
        cp -rf css/* android/app/src/main/assets/css/
        echo "Đã đồng bộ toàn bộ tài nguyên Web vào Android Assets"

    - name: ⚙️ Khởi tạo Gradle Wrapper & Cấp quyền thực thi
      run: |
        cd android
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: 🏷️ Đồng bộ Version Code & Version Name với GitHub Release
      run: |
        CURRENT_CODE=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | awk '{print $2}')
        RUN_NUM=${{ github.run_number }}
        NEW_CODE=$(( CURRENT_CODE >= RUN_NUM ? CURRENT_CODE + 1 : RUN_NUM ))
        sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/g" android/app/build.gradle
        sed -i "s/versionName \"[^\"]*\"/versionName \"1.1.$NEW_CODE\"/g" android/app/build.gradle
        echo "TARGET_VERSION_NAME=1.1.$NEW_CODE" >> $GITHUB_ENV
        cat android/app/build.gradle | grep -E "versionCode|versionName"

    - name: 🚀 Biên dịch file Android APK
      run: |
        cd android
        ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

    - name: 📦 Đổi tên file APK xuất bản
      run: |
        if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          cp android/app/build/outputs/apk/release/app-release.apk JarvisAI.apk
        else
          cp android/app/build/outputs/apk/debug/app-debug.apk JarvisAI.apk
        fi

    - name: 📤 Tải file APK lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JarvisAI-Android-App
        path: JarvisAI.apk
        retention-days: 30

    - name: 🏷️ Tạo GitHub Release tải về
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.TARGET_VERSION_NAME }}
        name: "Jarvis AI APK v${{ env.TARGET_VERSION_NAME }}"
        body: "Bản cập nhật v1.1 tích hợp Tủ thuốc thông minh Max Care, Gemini 3.8 Live, TTS Studio Pro và Đồng bộ Cloud 2 chiều."
        files: JarvisAI.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
