plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// --- CẤU HÌNH KÝ APK (không viết cứng mật khẩu trong repo public) ---
// Thứ tự ưu tiên: android/keystore.properties (file local, đã gitignore)
// -> biến môi trường (dùng cho CI/GitHub Secrets).
// Không tìm thấy keystore thì vẫn build được (APK ký bằng debug key) thay vì lỗi.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystoreProps = keystorePropsFile.exists()
if (hasKeystoreProps) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def signingValue = { String propKey, String envName, String fallback ->
    def fromProps = hasKeystoreProps ? keystoreProps.getProperty(propKey) : null
    if (fromProps) return fromProps
    def fromEnv = System.getenv(envName)
    if (fromEnv) return fromEnv
    return fallback
}

def releaseStoreFile = file(signingValue('storeFile', 'JARVIS_STORE_FILE', 'jarvis.keystore'))
def releaseStorePassword = signingValue('storePassword', 'JARVIS_STORE_PASSWORD', '')
def releaseKeyAlias = signingValue('keyAlias', 'JARVIS_KEY_ALIAS', 'jarviskey')
def releaseKeyPassword = signingValue('keyPassword', 'JARVIS_KEY_PASSWORD', '')
def canSignRelease =
        releaseStoreFile.exists() && releaseStorePassword && releaseKeyPassword

android {
    namespace 'com.kevinkieu.jarvisai'
    compileSdk 35

    defaultConfig {
        applicationId "com.kevinkieu.jarvisai"
        minSdk 24
        targetSdk 35
        versionCode 76
        versionName "1.1.76"
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Không có keystore riêng thì KÝ BẰNG DEBUG KEY: APK release vẫn cài được
            // (trước đây rơi vào trạng thái unsigned, cài sẽ báo "App not installed").
            signingConfig canSignRelease ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (canSignRelease) signingConfig signingConfigs.release
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.google.android.material:material:1.12.0'
}
