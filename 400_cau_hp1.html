[9,49,"Xây dựng lực lượng dự bị động viên bảo đảm giữa số lượng và chất lượng như thế nào?",["Số lượng đông, chất lượng cao, phải xây dựng toàn diện.","Số lượng đủ, chất lượng cao, xây dựng toàn diện nhưng có trọng tâm, trọng điểm.","Xây dựng toàn diện nhưng có trọng tâm, trọng điểm.","Số lượng hợp lý, chất lượng cao, nhất là chất lượng chính trị."],"B",""],
[9,50,"Một trong những nội dung xây dựng lực lượng dự bị động viên là:",["Tạo nguồn, đăng ký, biên chế lực lượng dự bị động viên.","Tạo nguồn, đăng ký, tổ chức lực lượng dự bị động viên theo kế hoạch.","Tạo nguồn, đăng ký, kiểm tra lực lượng dự bị động viên theo luật.","Tạo nguồn, đăng ký, quản lý lực lượng dự bị động viên."],"D",""],
[10,1,"Phong trào toàn dân bảo vệ an ninh Tổ quốc là hình thức hoạt động:",["Tự giác, không tổ chức của đông đảo nhân dân lao động tham gia phòng ngừa, phát hiện, đấu tranh chống các loại tội phạm…","Tự phát, có tổ chức của đông đảo nhân dân lao động tham gia phòng ngừa, phát hiện, đấu tranh chống các loại tội phạm…","Tự giác, có tổ chức của đông đảo nhân dân lao động tham gia phòng ngừa, phát hiện, đấu tranh chống các loại tội phạm…","Tự phát, không tổ chức của đông đảo nhân dân lao động tham gia phòng ngừa, phát hiện, đấu tranh chống các loại tội phạm…"],"C",""],
[10,2,"Vai trò của quần chúng nhân dân trong bảo vệ an ninh Tổ quốc, được thể hiện?",["Khả năng nắm bắt mọi hoạt động của các đối tượng phạm tội.","Khả năng kiểm tra, kiểm soát các loại tội phạm trong khu vực họ sinh sống.","Khả năng trực tiếp phòng chống, tố giác tấn công tội phạm.","Khả năng phát hiện, quản lý, giáo dục, cải tạo các loại tội phạm."],"D",""],
[10,3,"Quan điểm của Chủ nghĩa Mác - Lênin về vai trò của quần chúng nhân dân trong bảo vệ an ninh Tổ quốc?",["Là người làm nên lịch sử.","Là lực lượng nòng cốt.","Là một bộ phận quan trọng.","Là người có vai trò to lớn."],"A",""],
[10,4,"Đối tượng tham gia phong trào toàn dân bảo vệ an ninh Tổ quốc?",["Công an nhân dân, dân quân tự vệ, các đội tự quản.","Đa dạng, liên quan đến mọi người, mọi tầng lớp của xã hội.","Tập trung chủ yếu là công an, quân đội, tổ chức chính trị cơ sở.","Lực lượng vũ trang nhân dân và các tổ chức chính trị - xã hội."],"B",""],
[10,5,"Một trong những nội dung cơ bản của công tác xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc?",["Tham gia xây dựng tổ chức Đảng, chính quyền, đoàn thể quần chúng tại cơ sở vững mạnh.","Xây dựng kế hoạch phát động phong trào toàn dân bảo vệ an ninh Tổ quốc.","Tuyên truyền hướng dẫn nhân dân thực hiện nhiệm vụ bảo vệ an ninh Tổ quốc.","Nắm tình hình xây dựng kế hoạch phát động phong trào toàn dân bảo vệ Tổ quốc."],"A",""],
[10,6,"Một trong những phương pháp xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc là?",["Xây dựng tổ chức đoàn thể, quần chúng tại cơ sở vững mạnh.","Nắm tình hình và vận động toàn dân tích cực tham gia phong trào bảo vệ an ninh trật tự, an toàn xã hội.","Xây dựng mở rộng liên kết, phối hợp giữa các ban, ngành, đoàn thể.","Nắm tình hình và xây dựng kế hoạch phát động phong trào toàn dân bảo vệ an ninh Tổ quốc."],"D",""],
[10,7,"Một trong những phương pháp tuyên truyền giáo dục quần chúng nhân dân thực hiện nhiệm vụ bảo vệ an ninh Tổ quốc là:",["Vận động nhân dân chấp hành giao thông, trật tự công cộng.","Triệt để khai thác sử dụng phương tiện thông tin đại chúng.","Xây dựng cụm dân cư có nếp sống văn hoá, thuần phong mỹ tục.","Tuyên truyền giáo dục nhân dân xây dựng đời sống văn hoá."],"B",""],
[10,8,"Một trong những nội dung nắm tình hình trong phát động phong trào toàn dân bảo vệ an ninh Tổ quốc là:",["Đi sát cơ sở tiếp xúc, gặp gỡ, thu thập ý kiến nắm tình hình liên quan đến an ninh chính trị.","Vị trí địa lý, đặc điểm địa bàn, về phân bố dân cư, phong tục tập quán,...","Trực tiếp khảo sát điều tra hoạt động của tổ chức Đảng, chính quyền, đoàn thể và quần chúng nhân dân.","Vị trí địa lý, địa hình, vùng dân cư, tình hình kinh tế, văn hoá, xã hội có liên quan."],"B",""],
[10,9,"Tác dụng của phong trào toàn dân bảo vệ an ninh Tổ quốc?",["Là hình thức cơ bản để tập hợp thu hút đông đảo quần chúng phát huy quyền làm chủ trong lĩnh vực an ninh trật tự.","Là hình thức huy động sức dân trong đảm bảo an ninh trật tự.","Là hình thức cơ bản để bảo vệ an ninh trật tự.","Là hình thức đấu tranh với các loại tội phạm đảm bảo an ninh trật tự."],"A",""],
[10,10,"Một trong những trách nhiệm của sinh viên trong việc tham gia phong trào toàn dân bảo vệ an ninh Tổ quốc:",["Đây là phong trào sinh viên nên tổ chức tham gia.","Luôn luôn nêu cao ý thức cảnh giác, tích cực tham gia hoạt động phòng chống tội phạm ở địa phương, …","Luôn xác định đây là nhiệm vụ chủ yếu, bắt buộc sinh viên phải tham gia hoạt động phòng chống tội phạm.","Đây là phong trào quần chúng, sinh viên phải ý thức trách nhiệm."],"B",""],
[10,11,"Vị trí của phong trào toàn dân bảo vệ an ninh Tổ quốc?",["Có vị trí không thể thiếu được trong bảo vệ an ninh quốc gia, trật tự xã hội.","Là nền tảng của sự nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam XHCN.","Là nền tảng của sự nghiệp bảo vệ an ninh, trật tự.","Luôn giữ vị trí quan trọng không thể thiếu được đối với toàn bộ sự nghiệp cách mạng của Đảng."],"C",""],
[10,12,"Một trong những trách nhiệm của sinh viên trong việc tham gia xây dựng phong trào bảo vệ an ninh Tổ quốc:",["Mỗi sinh viên tự giác chấp hành các quy định về đảm bảo an ninh trật tự của nhà trường và của địa phương nơi cư trú.","Quan hệ khăng khít, tác động hỗ trợ qua lại lẫn nhau.","Mỗi sinh viên tự giác chấp hành các quy định trường lớp.","Không tàng trữ vũ khí, chất độc, chất nổ, chất dễ cháy."],"A",""],
[10,13,"Quan điểm về quần chúng nhân dân trong bảo vệ an ninh Tổ quốc?",["Là lực lượng đông đảo, là nền tảng cho đất nước, gốc rễ của dân tộc.","Là nền tảng cho đất nước, gốc rễ của dân tộc, động lực chính để phát triển kinh tế-xã hội.","Là lực lượng đông đảo, là nền tảng cho đất nước, gốc rễ của dân tộc, động lực chính để phát triển văn hoá-xã hội.","Là lực lượng đông đảo, là nền tảng cho một nước, là gốc rễ của một dân tộc, là động lực chính để thúc đẩy sự phát triển của xã hội."],"D",""],
[10,14,"Phong trào toàn dân bảo vệ an ninh Tổ quốc hoạt động trên hình thức nào?",["Tự giác, có sự tham gia của công an nhân dân.","Tự giác, có tổ chức.","Tự phát, có tổ chức.","Tự phát, có sự tham gia của chuyên môn."],"B",""],
[10,15,"Phong trào toàn dân bảo vệ an ninh tổ quốc với các phong trào hành động cách mạng khác của Đảng, Nhà nước ở địa phương, đơn vị có quan hệ như thế nào?",["Khăng khít, tác động hỗ trợ lẫn nhau.","Mật thiết để xây dựng kinh tế phát triền.","Gắn bó khăng khít, chặt chẽ với nhau.","Cùng vận động nhân dân tham gia công tác xã hội."],"A",""],
[10,16,"Phong trào toàn dân bảo vệ an ninh Tổ quốc giữ vị trí như thế nào trong sự nghiệp bảo vệ an ninh quốc gia, giữ gìn trật tự an toàn xã hội?",["Vị trí chiến lược, là điều kiện tiên quyết.","Vị trí chiến lược, là điều kiện cơ bản.","Vị trí chiến lược, là điều kiện cần thiết.","Vị trí chiến lược, là nền tảng cơ bản."],"D",""],
[10,17,"Phong trào toàn dân bảo vệ an ninh Tổ quốc mang tính chất?","Tính chính trị sâu sắc.","Tính xã hội sâu sắc.","Tính kinh tế, chính trị.","Tính nhân dân, tính dân tộc.","B",""],
[10,18,"Theo quan điểm của Đảng ta, tầng lớp nào là động lực chính để thúc đẩy sự thay đổi và phát triển của xã hội?",["Tầng lớp trí thức.","Giai cấp nông dân.","Quần chúng nhân dân.","Giai cấp công nhân."],"C",""],
[10,19,"Huy động sức mạnh của nhân dân trong phong trào toàn dân bảo vệ an ninh trật tự để:",["Phòng ngừa, phát hiện, đấu tranh chống các loại tội phạm.","Giải quyết các mâu thuẫn trên địa bàn.","Giáo dục, quản lí đối tượng phạm tội.","Duy trì các phong trào của thanh niên."],"A",""],
[10,20,"Quá trình tổ chức vận động phong trào toàn dân bảo vệ an ninh Tổ quốc phải chú trọng?","Sự tác động, ảnh hưởng lớn đến phong trào địa phương.","Gắn kết thực hiện chính sách của địa phương.","Gắn nghĩa vụ, quyền lợi của nhân dân.","Gắn nghĩa vụ, quyền lợi và tinh thần tự giác của nhân dân.","D",""],
[10,21,"Một trong những nội dung cơ bản của công tác xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc là:",["Giáo dục, nâng cao cảnh giác cách mạng, phát huy truyền thống yêu nước của nhân dân.","Xây dựng và mở rộng liên kết.","Xây dựng Đảng, chính quyền, đoàn thể.","Vận động toàn dân tự giác phòng chống tội phạm."],"A",""],
[10,22,"“Vận động toàn dân tích cực tham gia chương trình quốc gia phòng chống tội phạm” là:",["Mục đích xây dựng phong trào toàn dân bảo vệ an ninh Tổ Quốc.","Phương pháp xây dựng phong trào toàn dân bảo vệ an ninh Tổ Quốc.","Nội dung cơ bản của công tác xây dựng phong trào toàn dân bảo vệ an ninh Tổ Quốc.","Tác dụng xây dựng phong trào toàn dân bảo vệ an ninh Tổ Quốc."],"C",""],
[10,23,"Lực lượng nào giữ vai trò nòng cốt vận động, hướng dẫn, quần chúng nhân dân thực hiện phong trào toàn dân bảo vệ an ninh Tổ quốc?",["Lực lượng dự bị động viên.","Lực lượng công an nhân dân.","Lực lượng dân quân tự vệ.","Lực lượng quân đội nhân dân."],"B",""],
[10,24,"Quần chúng nhân dân có khả năng phát hiện, quản lý, giáo dục, cải tạo các loại tội phạm để thu hẹp dần đối tượng phạm tội là:",["Lợi ích của quần chúng nhân dân.","Vai trò của quần chúng nhân dân.","Nghĩa vụ của quần chúng nhân dân.","Quan điểm về quần chúng nhân dân."],"B",""],
[10,25,"Trong các quan điểm sau, quan điểm nào có nhận thức sai lệch về quần chúng nhân dân?",["Chủ tịch Hồ Chí Minh đưa ra những quan điểm về dân “Trong bầu trời không có gì quý bằng nhân dân”, “Dễ trăm lần không dân cũng chịu, khó vạn lần dân liệu cũng xong”.","Quần chúng nhân dân là lực lượng đông đảo, là nên tảng cho một nước, là gốc rễ của một dân tộc, là động lực chính để thúc đẩy sự phát triển của xã hội.","Triết học duy tâm cho rằng: Xã hội chia làm hai hạng người “Hạng thượng lưu” và “hạng thứ dân”, Thượng đế, tinh thần là tuyệt đối; vua là thiên tử, thay trời trị dân.","Chủ nghĩa Mác – Lê-Nin lần đầu tiên đã phát hiện và khẳng định vai trò của quần chúng nhân dân quyết định sự phát triển của xã hội, chính nhân dân lao động là người làm nên lịch sử."],"C",""],
[10,26,"Phong trào toàn dân bảo vệ an ninh Tổ quốc có bao nhiêu đặc điểm?","2","3","5","4","B",""],
[10,27,"Phong trào toàn dân bảo vệ an ninh Tổ quốc có bao nhiêu nội dung cơ bản?","4","3","6","5","A",""],
[10,28,"Để huy động được sức mạnh của toàn dân tham gia nhiệm vụ bảo vệ an ninh trật tự trong quá trình xây dựng phong trào, cần phải có sự kết hợp chặt chẽ giữa các:",["Tổ chức chính trị, xã hội.","Cơ quan, đơn vị trong địa bàn.","Cơ quan nhà nước.","Lực lượng, các cơ quan nhà nước, các tổ chức xã hội ở địa bàn."],"D",""],
[10,29,"Các tổ chức quần chúng nòng cốt làm nhiệm vụ an ninh trật tự ở địa bàn cơ sở gồm:",["Loại tổ chức quần chúng có chức năng tư vấn, loại có chức năng thực hành.","Loại có chức năng thực hành.","Loại tổ chức quần chúng có chức năng tư vấn, loại có chức năng quản lý, điều hành, loại có chức năng thực hành.","Loại có chức năng quản lý, điều hành."],"C",""],
[10,30,"Để nhân rộng điển hình tiên tiến trong xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc cần làm tốt các công việc nào sau đây:",["Lựa chọn điển hình tiên tiến, phổ biến kinh nghiệm điển hình tiên tiến.","Lựa chọn điển hình tiên tiến, tổ chức rút kinh nghiệm, tuyên truyền kinh nghiệm điển hình tiên tiến.","Lựa chọn điển hình tiên tiến, tổ chức rút kinh nghiệm điển hình tiên tiến.","Lựa chọn điển hình tiên tiến; tổ chức rút kinh nghiệm; phổ biến kinh nghiệm điển hình tiên tiến."],"D",""],
[10,31,"“Nhân dân giúp ta nhiều thì thành công nhiều, giúp ta ít thì thành công ít, giúp ta hoàn toàn thì thắng lợi hoàn toàn”. Là câu nói của ai?",["Nguyễn Văn Linh.","Võ Nguyên Giáp.","Lê Duẩn.","Chủ tịch Hồ Chí Minh."],"D",""],
[10,32,"“Nội dung, hình thức, phương pháp xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc ở các địa bàn, lĩnh vực khác nhau có sự khác nhau” là:",["Đặc điểm của xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc.","Vai trò của xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc.","Mục tiêu của xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc.","Lợi ích của xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc."],"A",""],
[10,33,"Trong phương pháp xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc. Để định ra nội dung, hình thức, phương pháp trước tiên phải làm gì?",["Xây dựng nội dung của phong trào.","Phổ biến các văn bản quy phạm pháp luật có liên quan.","Nắm tình hình và xây dựng kế hoạch phát động phong trào.","Tham mưu, đóng góp ý kiến xây dựng."],"C",""],
[10,34,"Phong trào toàn dân bảo vệ an ninh Tổ quốc được kết hợp với các phong trào khác của nhà trường và của địa phương:",["Lồng ghép phong trào đền ơn đáp nghĩa, chăm sóc người có công với nước…..","Lồng ghép phong trào đền ơn đáp nghĩa, phong trào tình nguyện.","Lồng ghép phong trào phòng chống tệ nạn xã hội, phong trào toàn dân đánh giặc.","Lồng ghép phong trào toàn dân đánh giặc, chăm sóc người có công với nước."],"A",""],
[10,35,"Nội dung tuyên truyền giáo dục quần chúng nhân dân thực hiện nhiệm vụ bảo vệ an ninh- trật tự:",["Tuyên truyền, phổ biến cho quần chúng nhân dân biết rõ kế hoạch của phong trào.","Tuyên truyền để nhân dân nhận thức rõ về âm mưu, phương thức thủ đoạn thâm độc nham hiểm của các thế lực thù địch và các loại tội phạm.","Tuyên truyền phổ biến các tình huống thực tế có thể xảy ra.","Tuyên truyền tổ chức cho nhân dân tích cực tham gia phong trào."],"B",""],
[10,36,"Mục đích của phong trào toàn dân bảo vệ an ninh trật tự?","Bảo vệ an ninh chính trị, trật tự an toàn xã hội, tài sản nhà nước, tính mạng và tài sản của nhân dân.","Bảo vệ an ninh chính trị, nên kinh tế, văn hoá, tính mạng và tài sản của nhân dân.","Bảo vệ an ninh chính trị, kinh tế, văn hoá, đại đoàn kết các dân tộc, tôn giáo.","Bảo vệ an ninh chính trị, quốc phòng, an ninh đối ngoại, đoàn kết dân tộc, tôn giáo.","A",""],
[11,1,"Luật An ninh Quốc gia năm 2004 được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam khóa XI thông qua và có hiệu lực thi hành?",["Năm 2007.","Năm 2005.","Năm 2006.","Năm 2004."],"B",""],
[11,2,"Trong bảo vệ an ninh quốc gia, nội dung nào sau đây được xác định là quan trọng nhất?",["Bảo vệ an ninh văn hoá - tư tưởng.","Bảo vệ an ninh chính trị nội bộ.","Bảo vệ an ninh kinh tế.","Bảo vệ an ninh thông tin."],"B",""],
[11,3,"Lực lượng nào giữ vai trò nòng cốt trong bảo vệ trật tự, an toàn xã hội?",["Quân đội nhân dân.","Cảnh sát biển.","Bộ đội biên phòng.","Công an nhân dân."],"D",""],
[11,4,"Cơ quan chuyên trách nào bảo vệ an ninh quốc gia ở khu vực biên giới trên đất liền và trên biển?",["Bộ đội biên phòng và công an nhân dân.","Bộ đội hải quân và cảnh sát biển.","Bộ đội biên phòng và cảnh sát cơ động.","Bộ đội biên phòng và cảnh sát biển."],"D",""],
[11,5,"Một trong những nguyên tắc bảo vệ an ninh quốc gia là:",["Đặt dưới sự lãnh đạo của Đảng và sự quản lý thống nhất của Bộ Quốc phòng.","Đặt dưới sự lãnh đạo của Đảng và sự quản lý thống nhất của Bộ Công an.","Đặt dưới sự lãnh đạo của Đảng và sự quản lý thống nhất của lực lượng vũ trang.","Đặt dưới sự lãnh đạo của Đảng và sự quản lý thống nhất của Nhà nước."],"D",""],
[11,6,"“Sự ổn định, phát triển bền vững của chế độ xã hội chủ nghĩa và Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, sự bất khả xâm phạm về độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Tổ quốc”. Được xác định là:",["Khái niệm an ninh quốc gia.","Nội dung của an ninh quốc gia.","Biện pháp bảo vệ an ninh quốc gia.","Nguyên tắc bảo vệ an ninh quốc gia."],"A",""],
[11,7,"Nội dung nào sau đây là một trong các nguyên tắc bảo vệ an ninh quốc gia?",["Kiên quyết đấu tranh phòng chống tội phạm.","Bảo vệ an ninh tư tưởng và văn hóa","Tuân thủ theo hiến pháp và pháp luật.","Bảo vệ chế độ chính trị và Nhà nước cộng hòa xã hội chủ nghĩa Việt Nam."],"C",""],
[11,8,"Nội dung nào sau đây không phải là biện pháp bảo vệ an ninh quốc gia?",["Biện pháp nghiệp vụ; biện pháp vũ trang.","Biện pháp ngoại giao; biện pháp kinh tế; biện pháp khoa học kỹ thuật.","Biện pháp vận động quần chúng; biện pháp pháp luật.","Biện pháp sử dụng bạo lực; biện pháp công nghệ."],"D",""],
[11,9,"Khó khăn trong bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội ở nước ta là:",["Lực lượng vũ trang cách mạng tuyệt đối trung thành với Đảng, với Tổ quốc với nhân dân.","Nhân dân Việt Nam có truyền thống yêu nước, đoàn kết, tin tưởng vào Đảng và chế độ.","Đảng Cộng sản Việt Nam có bản lĩnh chính trị vững vàng, dày dạn kinh nghiệm.","Các hành động xâm hại độc lập, chủ quyền, toàn vẹn lãnh thổ nước ta vẫn sẽ tiếp diễn."],"D",""],
[11,10,"Thuận lợi trong công tác bảo vệ an ninh quốc gia, giữ gìn trật tự, an toàn xã hội ở nước ta là:",["Các thế lực phản động tiếp tục sử dụng chiêu bài dân chủ, nhân quyền để can thiệp vào nội bộ nước ta.","Các vấn đề kinh tế, xã hội được cải thiện, nội bộ nhân dân đoàn kết.","Lực lượng vũ trang cách mạng tuyệt đối trung thành với Đảng, với Tổ quốc, nhân dân.","Kinh tế phát triển mạnh so với nhiều nước trong khu vực và trên thế giới."],"C",""],
[11,11,"Một trong những nguyên tắc để xác định đối tượng đấu tranh trong công tác bảo vệ an ninh quốc gia, bảo đảm trật tự an toàn xã hội là:",["Thiết lập và mở rộng quan hệ hữu nghị và hợp tác bình đẳng.","Các thế lực chống phá mục tiêu trong sự nghiệp xây dựng và bảo vệ Tổ quốc của nước ta.","Những ai chủ trương tôn trọng độc lập, chủ quyền Việt Nam.","Cùng có lợi với Việt Nam đều là đối tác của chúng ta."],"B",""],
[11,12,"Lĩnh vực nào sau đây không phải là nội dung trong bảo vệ an ninh quốc gia?",["Bảo vệ an ninh thông tin.","Bảo vệ an ninh chính trị nội bộ.","Bảo đảm trật tự an toàn giao thông.","Bảo vệ an ninh văn hoá tư tưởng."],"C",""],
[11,13,"Một trong những nội dung giữ gìn trật tự, an toàn xã hội là:",["Bảo vệ an ninh biên giới.","Bảo vệ an ninh dân tộc.","Bảo vệ an ninh kinh tế.","Bài trừ các tệ nạn xã hội."],"D",""],
[11,14,"Bảo vệ an ninh quốc gia là:",["Phòng ngừa, phát hiện, ngăn chặn đấu tranh làm thất bại các hoạt động xâm hại trật tự, an toàn xã hội.","Phòng ngừa, phát hiện, ngăn chặn đấu tranh làm thất bại các hoạt động xâm hại đến môi trường.","Phòng ngừa, phát hiện, ngăn chặn đấu tranh làm thất bại các hoạt động xâm hại an ninh quốc gia.","Phòng ngừa, phát hiện, ngăn chặn đấu tranh làm thất bại các hoạt động xâm hại an toàn giao thông."],"C",""],
[11,15,"Chọn đáp án phù hợp nhất: Bảo vệ trật tự an toàn xã hội là nhiệm vụ:",["Của toàn dân, lực lượng công an nhân dân giữ vai trò nòng cốt.","Của toàn Đảng, toàn dân, có chức năng tham mưu cho lực lượng công an nhân dân trong đấu tranh bảo vệ trật tự an toàn xã hội.","Của toàn Đảng, toàn dân, lực lượng công an nhân dân giữ vai trò nòng cốt.","Của lực lượng công an nhân dân giữ vai trò nòng cốt, trực tiếp đấu tranh phòng, chống tội phạm."],"C",""],
[11,16,"Một trong những nội dung bảo vệ an ninh chính trị nội bộ là:",["Bảo vệ đội ngũ văn nghệ sĩ, những người làm công tác văn hoá, văn nghệ.","Bảo vệ nền an ninh, trật tự của Tổ quốc ở khu vực biên giới quốc gia, cả trên đất liền và trên biển.","Bảo vệ các nhà khoa học, các nhà kinh doanh giỏi không để nước ngoài lôi kéo mua chuộc.","Bảo vệ các cơ quan đại diện, cán bộ, sinh viên và người lao động Việt Nam đang công tác, học tập và lao động ở nước ngoài."],"D",""],
[11,17,"Nội dung trong bảo vệ an ninh quốc gia gồm:","5 nội dung.","6 nội dung.","7 nội dung.","4 nội dung.","C",""],
[11,18,"Nội dung trong bảo đảm trật tự, an toàn xã hội gồm:","6 nội dung.","5 nội dung.","7 nội dung.","4 nội dung.","A",""],
[11,19,"Chọn đáp án đúng nhất: Bảo đảm trật tự an toàn giao thông là:",["Nhiệm vụ của tất cả mọi người khi tham gia giao thông.","Nhiệm vụ của tất cả người dân Việt Nam.","Nhiệm vụ riêng những người tham gia giao thông.","Nhiệm vụ riêng của cảnh sát giao thông, thanh tra giao thông."],"A",""],
[11,20,"Quan điểm của Đảng, Nhà nước trong công tác bảo vệ an ninh quốc gia, trật tự, an toàn xã hội gồm:","4 quan điểm","5 quan điểm","3 quan điểm","2 quan điểm","C",""],
[11,21,"Đối tượng nào sau đây xâm phạm đến an ninh quốc gia?",["Các đối tượng xâm phạm trật tự xã hội.","Các đối tượng phản động lợi dụng tôn giáo.","Các đối tượng xâm phạm trật tự quản lí kinh tế và chức vụ.","Các đối tượng về ma tuý."],"B",""],
[11,22,"Đối tượng nào sau đây không nằm trong nội dung xâm phạm trật tự an toàn xã hội ?",["Tội phạm gián điệp.","Tội phạm hình sự.","Tội phạm ma tuý.","Tội phạm kinh tế."],"A",""],
[11,23,"Quyền và nghĩa vụ của công dân trong bảo vệ an ninh quốc gia, trật tự, an toàn xã hội được quy định tại hiến pháp nước Cộng hoà xã hội chủ nghĩa Việt Nam năm nào?",["Năm 1999.","Năm 2001.","Năm 2013.","Năm 2004"],"C","Hiến pháp hiện hành năm 2013."],
[11,24,"Theo luật An ninh quốc gia năm 2004 thì: “Bảo vệ chế độ chính trị và Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, bảo vệ độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc”. Được xác định:",["Là một trong những nhiệm vụ bảo vệ an ninh quốc gia.","Là một trong những nguyên tắc bảo vệ an ninh quốc gia.","Là một trong những mục tiêu bảo vệ an ninh quốc gia.","Là một trong những nội dung bảo vệ an ninh quốc gia."],"A",""],
[11,25,"Theo luật An ninh quốc gia năm 2004 thì “Tuân thủ Hiến pháp, pháp luật bảo đảm lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân”. Được xác định:",["Là một trong những nguyên tắc bảo vệ an ninh quốc gia.","Là một trong những nhiệm vụ bảo vệ an ninh quốc gia.","Là một trong những mục tiêu bảo vệ an ninh quốc gia.","Là một trong những nội dung bảo vệ an ninh quốc gia."],"A",""],
[11,26,"Một trong những quan điểm của Đảng, Nhà nước ta trong công tác bảo vệ an ninh quốc gia, giữ gìn trật tự an toàn xã hội?",["Kết hợp chặt chẽ nhiệm vụ xây dựng với nhiệm vụ bảo vệ biển, đảo của Tổ quốc.","Kết hợp phát triển kinh tế văn hóa xã hội với bảo vệ Tổ quốc.","Kết hợp chặt chẽ nhiệm vụ xây dựng với nhiệm vụ bảo vệ lãnh thổ quốc gia.","Kết hợp chặt chẽ nhiệm vụ xây dựng với nhiệm vụ bảo vệ Tổ quốc."],"D",""],
[11,27,"An ninh quốc gia và trật tự an toàn xã hội là hai thành phần cấu thành nên yếu tố nào?",["Cấu thành trật tự xã hội.","Cấu thành nhà nước.","Cấu thành lãnh thổ quốc gia.","Cấu thành an ninh quốc gia."],"A",""],
[11,28,"“Trạng thái xã hội bình yên trong đó mọi người được sống yên ổn trên cơ sở các quy phạm pháp luật, các qui tắc và chuẩn mực đạo đức, pháp lý” là khái niệm về:",["An ninh quốc gia.","Tệ nạn xã hội.","Quốc phòng, an ninh.","Trật tự, an toàn xã hội."],"D",""],
[11,29,"Vai trò của Đảng trong lĩnh vực bảo vệ an ninh quốc gia và trật tự, an toàn xã hội?",["Phối kết hợp chức năng quản lí của các cơ quan Nhà nước với các tổ chức, đoàn thể vào việc bảo vệ an ninh quốc gia và trật tự, an toàn xã hội.","Phát huy vai trò tác dụng của Hội đồng Nhân dân và Uỷ ban Nhân dân các cấp trong việc ban hành và đôn đốc tổ chức thực hiện những quy định về công tác bảo vệ ở địa phương.","Đề ra đường lối chính sách và phương pháp đấu tranh bảo vệ an ninh quốc gia và trật tự, an toàn xã hội một cách đúng đắn, lãnh đạo chặt chẽ bộ máy Nhà nước.","Phải thường xuyên quan tâm xây dựng các cơ quan chuyên trách trong công tác bảo vệ an ninh quốc gia và giữ gìn trật tự, an toàn xã hội."],"C",""],
[11,30,"Một trong những nội dung tăng cường hiệu lực quản lí của nhà nước trên lĩnh vực bảo vệ an ninh quốc gia và trật tự, an toàn xã hội là:",["Quán triệt sâu sắc và tự giác chấp hành nghiêm chỉnh đường lối chính sách của Đảng, pháp luật của Nhà nước, các chế độ thể lệ nội quy về bảo vệ an ninh trật tự.","Phát huy mạnh mẽ tác dụng của pháp chế xã hội chủ nghĩa làm cho nó trở thành vũ khí sắc bén để xây dựng và quản lí nền trật tự xã hội xã hội chủ nghĩa.","Đề ra đường lối chính sách và phương pháp đấu tranh bảo vệ an ninh quốc gia và trật tự, an toàn xã hội một cách đúng đắn.","Làm tham mưu cho Đảng, Nhà nước về những vấn đề có liên quan đến công tác bảo vệ an ninh quốc gia và trật tự, an toàn xã hội."],"B",""],
[11,31,"Cơ quan chuyên trách bảo vệ an ninh quốc gia có trách nhiệm?",["Bảo đảm an toàn cho cơ quan, tổ chức cá nhân tham gia công tác bảo vệ an ninh quốc gia.","Giữ bí mật về sự giúp đỡ của cơ quan, tổ chức, cá nhân đối với công tác bảo vệ an ninh quốc gia.","Bảo vệ bí mật cho các cơ quan, tổ chức, cá nhân tham gia công tác bảo vệ an ninh quốc gia.","Bảo đảm chính sách cho các cơ quan, tổ chức, cá nhân tham gia công tác bảo vệ an ninh quốc gia."],"B",""],
[11,32,"Theo luật An ninh quốc gia năm 2004, “khi đất nước có tình trạng khẩn cấp, tình trạng chiến tranh” thì cơ quan nào có trách nhiệm động viên mọi lực lượng và khả năng của đất nước để bảo vệ Tổ quốc?",["Thủ tướng Chính phủ.","Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam.","Mặt trận Tổ quốc Việt Nam và các tổ chức thành viên.","Hội đồng quốc phòng và an ninh."],"D",""],
[11,33,"Theo bộ luật hình sự 2017 sửa đổi, bổ sung một số điều của bộ luật hình sự năm 2015 qui định, có bao nhiêu loại tội phạm xâm phạm an ninh quốc gia?","15 loại.","13 loại.","14 loại.","12 loại.","C",""],
[11,34,"“ Đảm bảo chính sách tự do tín ngưỡng của Đảng và Nhà nước đối với nhân dân ” là nội dung bảo vệ trên lĩnh vực?",["Bảo vệ an ninh tôn giáo.","Bảo vệ an ninh dân tộc.","Bảo vệ an ninh tư tưởng, văn hoá.","Bảo vệ an ninh chính trị."],"A",""]
];

// Chuyển mảng gọn thành DATA chuẩn cho app
const DATA = RAW_DATA.map((row, index) => ({
  bai: row[0],
  num: row[1],
  q: row[2],
  opts: [["A", row[3][0]], ["B", row[3][1]], ["C", row[3][2]], ["D", row[3][3]]],
  global: index + 1,
  answer: row[4],
  flag: row[5] || ""
}));

let session=null, answered=false, selected=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('gdqp_hp1_400_session',JSON.stringify(session))}
function load(){try{return JSON.parse(localStorage.getItem('gdqp_hp1_400_session'))}catch(e){return null}}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function reset(){session=null;localStorage.removeItem('gdqp_hp1_400_session');$('setup').classList.remove('hidden');$('quiz').classList.add('hidden');$('result').classList.add('hidden')}
function buildPool(){
 const mode=$('mode').value;
 if(mode==='all') return DATA.map((_,i)=>i);
 if(mode==='range'){let a=Math.max(1,+$('from').value||1),b=Math.min(DATA.length,+$('to').value||DATA.length); if(a>b)[a,b]=[b,a]; return Array.from({length:b-a+1},(_,i)=>a-1+i)}
 if(mode==='random'){let n=Math.min(DATA.length,Math.max(1,+$('n').value||30)); return [...Array(DATA.length).keys()].sort(()=>Math.random()-.5).slice(0,n)}
 if(mode==='lesson'){let b=+$('lesson').value; return DATA.map((x,i)=>x.bai===b?i:-1).filter(i=>i>=0)}
}
function start(pool,continueOld=false){
 if(continueOld){session=load(); if(!session){alert('Chưa có phiên đã lưu trước đó.');return}}
 else {session={pool:pool,pos:0,score:0,answered:0,history:[],started:Date.now()};save()}
 $('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()
}
function render(){
 const idx=session.pool[session.pos], q=DATA[idx]; answered=false;selected=null;
 $('counter').textContent=`Câu ${q.global} (Bài ${q.bai}) • ${session.pos+1}/${session.pool.length}`;
 $('score').textContent=`Đúng: ${session.score}/${session.answered}`;
 $('q').innerHTML=esc(q.q);
 $('opts').innerHTML=q.opts.map(([l,o])=>`<button class="opt" data-a="${l}" onclick="answer('${l}')"><b>${l}.</b> ${esc(o)}</button>`).join('');
 $('feedback').className='feedback hidden';$('feedback').innerHTML='';
 $('next').classList.add('hidden');$('prev').disabled=session.pos===0;
 $('bar').style.width=((session.pos)/session.pool.length*100)+'%';
 if(q.flag){$('warning').classList.remove('hidden');$('warning').textContent='💡 '+q.flag}else $('warning').classList.add('hidden');
}
function answer(a){
 if(answered)return; answered=true;selected=a;
 const q=DATA[session.pool[session.pos]], ok=a===q.answer; session.answered++; if(ok)session.score++;
 session.history.push({global:q.global,answer:a,correct:q.answer,ok});
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.a===q.answer)b.classList.add('correct');if(b.dataset.a===a&&!ok)b.classList.add('wrong')});
 $('feedback').className='feedback '+(ok?'ok':'bad');
 $('feedback').innerHTML=`<b>${ok?'✓ Chính xác!':'✗ Chưa đúng.'}</b> — Đáp án chuẩn: <b>${q.answer}</b><div class="explain">${esc(explain(q))}</div>`;
 $('next').classList.remove('hidden'); save();
}
function explain(q){
 const map={
 1:'Theo HP1: Đối tượng, phương pháp nghiên cứu môn học GDQP-AN.',
 2:'Theo HP1: Quan điểm Mác - Lênin & Tư tưởng HCM về chiến tranh, quân đội, BVTQ.',
 3:'Theo HP1: Xây dựng nền quốc phòng toàn dân, an ninh nhân dân.',
 4:'Theo HP1: Chiến tranh nhân dân bảo vệ Tổ quốc Việt Nam XHCN.',
 5:'Theo HP1: Xây dựng lực lượng vũ trang nhân dân Việt Nam.',
 6:'Theo HP1: Kết hợp phát triển kinh tế - xã hội với tăng cường QP-AN và đối ngoại.',
 7:'Theo HP1: Những vấn đề cơ bản về lịch sử nghệ thuật quân sự Việt Nam.',
 8:'Theo HP1: Xây dựng và bảo vệ chủ quyền biển, đảo, biên giới quốc gia.',
 9:'Theo HP1: Xây dựng lực lượng DQTV, dự bị động viên và động viên quốc phòng.',
 10:'Theo HP1: Xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc.',
 11:'Theo HP1: Bảo vệ an ninh quốc gia và bảo đảm trật tự an toàn xã hội.'
 };
 return map[q.bai]||'Đối chiếu tài liệu học tập Học phần 1.';
}
function next(){if(session.pos<session.pool.length-1){session.pos++;save();render()}else finish()}
function prev(){if(session.pos>0){session.pos--;save();render()}}
function finish(){save();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('final').textContent=`Bạn đã hoàn thành ${session.pool.length} câu — Trả lời đúng ${session.score}/${session.answered} (${Math.round(session.score/session.answered*100)}%).`}
$('mode').addEventListener('change',()=>{let m=$('mode').value;$('range').classList.toggle('hidden',m!=='range');$('random').classList.toggle('hidden',m!=='random');$('lessonBox').classList.toggle('hidden',m!=='lesson')});
$('start').onclick=()=>start(buildPool()); $('continue').onclick=()=>start(null,true); $('reset').onclick=reset; $('next').onclick=next; $('prev').onclick=prev;
document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hidden'))return;if(['a','b','c','d'].includes(e.key.toLowerCase()))answer(e.key.toUpperCase());if(e.key==='Enter'&&!$('next').classList.contains('hidden'))next()});
</script></body></html>
