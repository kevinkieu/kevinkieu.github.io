[2,20,"Theo quan điểm của Lênin về bản chất của chiến tranh là?",["Sự tiếp tục của của quân sự bằng bạo lực.","Sự tiếp tục của những lợi ích bằng bạo lực.","Sự tiếp tục của chính trị bằng bạo lực.","Sự tiếp tục của mâu thuẩn bằng bạo lực."],"C",""],
[2,21,"Theo quan điểm của chủ nghĩa Mác – Lênin về bản chất của chiến tranh là:",["Giải quyết những mâu thuẩn vốn có trong xã hội có đối kháng giai cấp.","Làm tăng thêm những mâu thuẩn vốn có trong xã hội có đối kháng giai cấp.","Làm xóa bỏ những mâu thuẩn vốn có trong xã hội có đối kháng giai cấp.","Làm giảm đi những mâu thuẩn vốn có trong xã hội có đối kháng giai cấp."],"B",""],
[2,22,"Theo quan điểm của tư tưởng Hồ Chí Minh: bạo lực cách mạng được tạo bởi sức mạnh của toàn dân, bằng:",["Cả lực lượng chính trị và sức mạnh tinh thần.","Cả lực lượng chính trị và lực lượng vũ trang.","Cả lực lượng chính trị và lực lượng bán vũ trang.","Cả lực lượng chính trị và lực lượng quân sự."],"B",""],
[2,23,"« Ngày nay chiến tranh giải phóng dân tộc của nhân dân ta là chiến tranh nhân dân dưới sự lãnh đạo của Đảng » : là lời khẳng định của:",["Trường Chinh.","Hồ Chí Minh.","Nguyễn Văn Linh.","Võ Nguyên Giáp."],"B","Giáo trình trang 19: Hồ Chí Minh khẳng định."],
[2,24,"Theo quan điểm của chủ nghĩa Mác – Lênin về nguồn gốc ra đời của quân đội?",["Là sự xuất hiện chế độ tư hữu về tư liệu sản xuất và sự phân chia xã hội thành giai cấp đối kháng.","Khi có chiến tranh xâm lược.","Là sự xuất hiện loài người trên trái đất.","Khi các nước lớn mở rộng lãnh thổ."],"A",""],
[2,25,"Bản chất giai cấp của quân đội theo quan điểm của chủ nghĩa Mác – Lênin?",["Là sự xuất hiện chế độ tư hữu về tư liệu sản xuất là chủ yếu.","Là những cuộc chiến tranh xâm lược vơ vét tài nguyên.","Là công cụ thực hiện phi bạo lực của một giai cấp, nhà nước nhất định.","Là công cụ bạo lực vũ trang của một giai cấp, nhà nước nhất định."],"D",""],
[2,26,"Sức mạnh chiến đấu của quân đội thể hiện: “Trong mọi cuộc chiến tranh rốt cuộc thắng lợi đều tùy thuộc vào tinh thần của quần chúng đang đổ máu trên chiến trường” là lời khẳng định của ai?",["Ph. Ăngghen.","V. I.Lênin","Mac.","Hồ Chí Minh."],"B",""],
[2,27,"Khẳng định sự ra đời của quân đội là một tất yếu, là vấn đề có tính quy luật trong đấu tranh giai cấp, đấu tranh dân tộc ở Việt Nam là:",["Tư tưởng của Võ Nguyên Giáp về quân đội.","Tư tưởng của Trần Đại Nghĩa về quân đội.","Tư tưởng của Trường Chinh về quân đội.","Tư tưởng của Hồ Chí Minh về quân đội."],"D",""],
[2,28,"Theo Tư tưởng Hồ Chí Minh, Quân đội nhân dân Việt Nam mang bản chất?",["Của giai cấp công nhân.","Của giai cấp công – nông - trí thức.","Của giai cấp công - nông.","Của giai cấp công nhân tiến bộ."],"A",""],
[2,29,"Theo Tư tưởng Hồ Chí Minh, nhiệm vụ cơ bản của quân đội là:",["Thiết thực tham gia huấn luyện, diễn tập, nâng cao kỹ năng tác chiến.","Thiết thực tham gia xây dựng thế trận phòng thủ vững chắc.","Thiết thực tham gia củng cố tiềm lực quân sự của đất nước.","Thiết thực tham gia lao động sản xuất góp phần xây dựng chủ nghĩa xã hội."],"D",""],
[2,30,"Tư tưởng Hồ Chí Minh về bảo vệ Tổ quốc xã hội chủ nghĩa?",["Đảng Cộng sản lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa.","Phải thường xuyên tăng cường tiềm lực quốc phòng gắn với phát triển kinh tế - xã hội.","Bảo vệ Tổ quốc xã hội chủ nghĩa là một tất yếu khách quan.","Mục tiêu bảo vệ tổ quốc là độc lập dân tộc và chủ nghĩa xã hội, là nghĩa vụ và trách nhiệm của mọi công dân."],"D",""],
[2,31,"Tư tưởng Hồ Chí Minh về bảo vệ Tổ quốc xã hội chủ nghĩa?",["Sức mạnh bảo vệ Tổ quốc là sức mạnh tổng hợp của cả dân tộc, cả nước, kết hợp với sức mạnh thời đại.","Sức mạnh bảo vệ Tổ quốc là sức mạnh quân sự của dân tộc, cả nước, kết hợp với sức mạnh thời đại.","Sức mạnh bảo vệ Tổ quốc là sức mạnh tinh thần của dân tộc, cả nước, kết hợp với sức mạnh thời đại.","Sức mạnh bảo vệ Tổ quốc là sức mạnh chính trị của dân tộc, cả nước, kết hợp với sức mạnh thời đại."],"A",""],
[2,32,"Theo tư tưởng Hồ Chí Minh, sử dụng bạo lực cách mạng để?",["Xây dựng và bảo vệ chính quyền cách mạng, xây dựng chế độ mới.","Giành chính quyền và bảo vệ chính quyền.","Tiêu diệt các lực lượng phản cách mạng và lật đổ chính quyền phản động.","Lật đổ chế độ cũ, xây dựng chế độ mới."],"B",""],
[2,33,"Lý luận của chủ nghĩa Mác-Lê Nin về bản chất giai cấp của quân đội là:",["Mang bản chất giai cấp nhà nước đã tổ chức nuôi dưỡng và sử dụng quân đội.","Mang bản chất từ thành phần xuất thân của lực lượng vũ trang.","Mang bản chất quần chúng nhân dân lao động.","Là lực lượng bảo vệ đất nước, không mang bản chất chính trị."],"A",""],
[2,34,"Theo quan điểm của Ph. Ăngghen, chiến tranh trở thành “Bạn đường” của mọi chế độ tư hữu, đó chính là?",["Bản chất của cuộc chiến tranh.","Mục tiêu của cuộc chiến tranh.","Tính chất của cuộc chiến tranh.","Nguồn gốc nảy sinh chiến tranh."],"D",""],
[2,35,"Theo quan điểm của Lênin về bản chất của chiến tranh là?",["Một phương thức tranh giành lợi ích.","Một hiện tượng lịch sử cụ thể.","Một hiện tượng lịch sử cụ thể, phát sinh nhiều mâu thuẩn.","Thể hiện dưới một hình thức đặc biệt."],"B",""],
[2,36,"Theo quan điểm của chủ nghĩa Mác – Lênin về bản chất của chiến tranh là:",["Kinh tế chi phối và quyết định toàn bộ tiến trình và kết cục của chiến tranh.","Chính trị chi phối và quyết định toàn bộ tiến trình và kết cục của chiến tranh.","Quân sự chi phối và quyết định toàn bộ tiến trình và kết cục của chiến tranh.","Kinh tế, văn hóa, tư tưởng chi phối và quyết định toàn bộ tiến trình và kết cục của chiến tranh."],"B",""],
[2,37,"Quan điểm của V. I.Lênin về nguyên tắc cơ bản xây dựng quân đội kiểu mới là:",["Đoàn kết thống nhất quân đội với nhân dân; trung thành với chủ nghĩa quốc tế vô sản.","Đoàn kết thống nhất ý chí chiến đấu; trung thành với chủ nghĩa quốc tế vô sản.","Đoàn kết thống nhất quân đội với giai cấp; trung thành với chủ nghĩa quốc tế vô sản.","Đoàn kết thống nhất quân đội với nhân dân; trung thành tuyệt đối với Tổ quốc."],"A",""],
[2,38,"Quan điểm của chủ nghĩa Mác – Lênin về bảo vệ Tổ quốc xã hội chủ nghĩa?",["Sự nghiệp bảo vệ Tổ quốc là thiêng liêng, là nghĩa vụ của mọi công dân.","Độc lập dân tộc và chủ nghĩa xã hội.","Sức mạnh bảo vệ Tổ quốc là sức mạnh tổng hợp của cả dân tộc.","Bảo vệ Tổ quốc xã hội chủ nghĩa là một tất yếu khách quan."],"D","Mục 3.1 Giáo trình: Bảo vệ Tổ quốc XHCN là tất yếu khách quan."],
[2,39,"Quan điểm của chủ nghĩa Mác – Lênin về bảo vệ Tổ quốc xã hội chủ nghĩa?",["Bảo vệ Tổ quốc xã hội chủ nghĩa là nghĩa vụ, trách nhiệm của toàn dân tộc, toàn thể giai cấp công nhân và nhân dân lao động.","Bảo vệ Tổ quốc xã hội chủ nghĩa là mục tiêu chiến lược của toàn dân tộc, toàn thể giai cấp công nhân và nhân dân lao động.","Bảo vệ Tổ quốc xã hội chủ nghĩa là trách nhiệm mỗi công dân, toàn thể giai cấp công nhân và các lực lượng.","Bảo vệ Tổ quốc xã hội chủ nghĩa là thiêng liêng, trách nhiệm của toàn dân tộc và nhân dân lao động."],"A",""],
[2,40,"Quan điểm của chủ nghĩa Mác – Lênin về bảo vệ Tổ quốc xã hội chủ nghĩa?",["Đảng Cộng sản lãnh đạo mọi mặt sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa.","Đảng lãnh đạo sự nghiệp xây dựng và bảo vệ Tổ quốc xã hội chủ nghĩa.","Đảng Cộng sản tiên phong trong nhiệm vụ bảo vệ Tổ quốc xã hội chủ nghĩa.","Đảng lãnh đạo mọi hoạt động của sự nghiệp bảo vệ Tổ quốc xã hội chủ nghĩa."],"A",""],
[3,1,"Nền quốc phòng toàn dân là sức mạnh quốc phòng của đất nước được xây dựng trên nền tảng?",["Nhân lực, tinh thần mang tính chất toàn dân, toàn diện, tự chủ, độc lập, tự lực, tự cường.","Nhân lực, vật lực, tinh thần mang tính chất toàn dân, toàn diện, tự chủ, độc lập, tự cường.","Nhân lực, vật lực, tinh thần mang tính chất toàn dân, toàn diện, tự chủ, độc lập, tự lực, tự cường.","Nhân lực, vật lực, mang tính chất toàn dân, toàn diện, tự chủ, độc lập, tự cường."],"C",""],
[3,2,"An ninh nhân dân là sự nghiệp của?",["Là sự nghiệp của toàn quân, do công an tiến hành, lực lượng vũ trang làm nòng cốt dưới sự lãnh đạo của Đảng và sự quản lí của Nhà nước.","Là sự nghiệp của toàn quân, do công an tiến hành, lực lượng vũ trang làm nòng cốt dưới sự lãnh đạo của Đảng và sự quản lí của Nhà nước.","Là sự nghiệp của toàn dân, do quân đội tiến hành, lực lượng vũ trang làm nòng cốt dưới sự lãnh đạo của Đảng và sự quản lí của Nhà nước.","Là sự nghiệp của toàn dân, do nhân dân tiến hành, lực lượng an ninh nhân dân làm nòng cốt dưới sự lãnh đạo của Đảng và sự quản lí của Nhà nước."],"D",""],
[3,3,"Xây dựng nền quốc phòng, an ninh nhân dân vững mạnh là tạo ra sức mạnh để?",["Ngăn ngừa, đẩy lùi, đánh bại mọi âm mưu xâm hại đến mục tiêu trong sự nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Ngăn ngừa, đẩy lùi, đánh bại mọi âm mưu, hành động xâm hại đến mục tiêu trong sự nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Ngăn ngừa, đánh bại mọi âm mưu, hành động xâm hại đến mục tiêu trong sự nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Đánh bại mọi âm mưu, hành động xâm hại đến mục tiêu trong sự nghiệp xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa."],"B",""],
[3,4,"Trong vị trí của nền quốc phòng toàn dân, Đảng ta khẳng định:",["Trong khi đặt trọng tâm vào nhiệm vụ xây dựng chủ nghĩa xã hội, chúng ta không một chút lơi lỏng nhiệm vụ bảo vệ Tổ quốc, luôn luôn coi trọng quốc phòng – an ninh, coi đó là nhiệm vụ chiến lược gắn bó chặt chẽ.","Trong khi đặt trọng tâm vào nhiệm vụ bảo vệ Tổ quốc, luôn luôn coi trọng ngoại giao, coi đó là nhiệm vụ chiến lược gắn bó chặt chẽ.","Trong khi đặt trọng tâm vào nhiệm vụ bảo vệ Tổ quốc, luôn luôn coi trọng văn hóa – xã hội, coi đó là nhiệm vụ chiến lược gắn bó chặt chẽ.","Trong khi đặt trọng tâm vào nhiệm vụ bảo vệ Tổ quốc, luôn luôn coi trọng tư tưởng - chính trị – xã hội, coi đó là nhiệm vụ chiến lược gắn bó chặt chẽ."],"A",""],
[3,5,"Một trong những đặc trưng của nền quốc phòng toàn dân, an ninh nhân dân của ta:",["Nền quốc phòng, an ninh có sức mạnh của dân tạo thành.","Nền quốc phòng, an ninh có sức mạnh tổng hợp do nhiều yếu tố tạo thành.","Nền quốc phòng, an ninh có sức mạnh của công an tạo thành.","Nền quốc phòng, an ninh có sức mạnh của quân đội tạo thành."],"B",""],
[3,6,"Một trong những đặc trưng của nền quốc phòng toàn dân, an ninh nhân dân của ta:",["Nền quốc phòng, an ninh vì dân, của dân và do Ủy ban Mặt trận Tổ quốc Việt Nam tiến hành.","Nền quốc phòng, an ninh vì dân, của dân và do quân đội nhân dân tiến hành.","Nền quốc phòng, an ninh vì dân, của dân và do toàn thể nhân dân tiến hành.","Nền quốc phòng, an ninh vì dân, của dân và do công an nhân dân tiến hành."],"C",""],
[3,7,"Nét đặc trưng của nền quốc phòng toàn dân gắn chặt với nền an ninh nhân dân của chúng ta đều được xây dựng nhằm mục đích?",["Tự vệ, đều phải chống thù trong, giặc ngoài để bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Đấu tranh, phải chống giặc ngoại xâm để bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Đấu tranh, đều phải chống thù trong, giặc ngoài để bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Tự vệ, phải chống giặc ngoại xâm để bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa."],"A",""],
[3,8,"Mục đích xây dựng nền quôc phòng toàn dân, an ninh nhân dân vững mạnh hiện nay là?",["Tạo sức mạnh phát triển kinh tế - xã hội, khoa học và công nghệ của đất nước ta; Tạo thế chủ động cho sự nghiệp xây dựng và bảo vệ tổ quốc.","Tạo sức mạnh về quân sự của đất nước ta; Tạo thế chủ động cho sự nghiệp xây dựng và bảo vệ tổ quốc.","Tạo sức mạnh phát triển kinh tế - xã hội của đất nước ta; Tạo thế chủ động cho sự nghiệp xây dựng và bảo vệ tổ quốc.","Tạo sức mạnh tổng hợp của đất nước ta; Tạo thế chủ động cho sự nghiệp xây dựng và bảo vệ tổ quốc."],"D",""],
[3,9,"Một trong những nhiệm vụ xây dựng nền quốc phòng toàn dân, an ninh nhân dân vững mạnh hiện nay là:",["Xây dựng lực lượng quốc phòng, an ninh đáp ứng yêu cầu bảo vệ các cụm kinh tế.","Xây dựng lực lượng quốc phòng, an ninh đáp ứng yêu cầu bảo vệ các vùng biên giới.","Xây dựng lực lượng quốc phòng, an ninh đáp ứng yêu cầu bảo vệ các mục tiêu.","Xây dựng lực lượng quốc phòng, an ninh đáp ứng yêu cầu bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa."],"D",""],
[3,10,"Tiềm lực quốc phòng, an ninh là:",["Khả năng về nhân lực, phương tiện kỹ thuật có thể huy động để thực hiện nhiệm vụ quốc phòng, an ninh.","Khả năng về nhân lực, vật lực có thể huy động để thực hiện nhiệm vụ quốc phòng, an ninh.","Khả năng về nhân lực, vật lực, tài chính có thể huy động để thực hiện nhiệm vụ quốc phòng, an ninh.","Khả năng về nhân lực, tài chính có thể huy động để thực hiện nhiệm vụ quốc phòng, an ninh."],"C",""],
[3,11,"Tiềm lực quốc phòng, an ninh được thể hiện trên tất cả các lĩnh vực của đời sống xã hội, nhưng tập trung ở những tiềm lực?",["Tiềm lực chính trị, văn hóa; tiềm lực giáo dục; tiềm lực khoa học, công nghệ; tiềm lực quân sự, an ninh.","Tiềm lực chính trị, tinh thần; tiềm lực giáo dục; tiềm lực khoa học, công nghệ; tiềm lực quân sự, an ninh.","Tiềm lực chính trị, tinh thần; tiềm lực kinh tế; tiềm lực khoa học, công nghệ; tiềm lực quân sự, an ninh.","Tiềm lực chính trị, tinh thần; tiềm lực văn hóa; tiềm lực khoa học, công nghệ; tiềm lực quân sự, an ninh."],"C",""],
[3,12,"Xây dựng tiềm lực quốc phòng, an ninh là tập trung xây dựng những tiềm lực nào?",["Tiềm lực chính trị, tinh thần; tiềm lực kinh tế; tiềm lực giáo dục; tiềm lực khoa học, công nghệ và xây dựng tiềm lực quân sự, an ninh.","Tiềm lực chính trị, tinh thần; tiềm lực kinh tế; tiềm lực khoa học, công nghệ và xây dựng tiềm lực quân sự, an ninh.","Tiềm lực chính trị, tinh thần; tiềm lực kinh tế; tiềm lực khoa học, công nghệ và xây dựng tiềm lực giáo dục","Tiềm lực chính trị, tinh thần; tiềm lực giáo dục; tiềm lực khoa học, công nghệ và xây dựng tiềm lực quân sự, an ninh."],"B",""],
[3,13,"Một trong những nội dung xây lực tiềm lực quốc phòng, an ninh ngày càng vững mạnh là:",["Xây dựng tiềm lực chính trị, tinh thần.","Xây dựng tiềm lực chính trị, tinh thần, an ninh, đối ngoại.","Xây dựng tiềm lực chính trị, tinh thần, văn hóa, giáo dục","Xây dựng tiềm lực chính trị, văn hóa – xã hội, tinh thần."],"A",""],
[3,14,"Xây dựng tiềm lực quân sự, an ninh của nền quốc phòng toàn dân, an ninh nhân dân là:",["Khả năng về tư tưởng và tinh thần có thể huy động tạo thành sức mạnh phục vụ cho nhiệm vụ quân sự, an ninh, cho chiến tranh.","Khả năng về vật chất, vật lực và tinh thần có thể huy động tạo thành sức mạnh phục vụ cho nhiệm vụ quân sự, an ninh, cho chiến tranh.","Khả năng về vũ khí, phương tiện kỹ thuật có thể huy động tạo thành sức mạnh phục vụ cho nhiệm vụ quân sự, an ninh, cho chiến tranh.","Khả năng về vật chất và tinh thần có thể huy động tạo thành sức mạnh phục vụ cho nhiệm vụ quân sự, an ninh, cho chiến tranh."],"D",""],
[3,15,"Thế trận quốc phòng, an ninh là:",["Sự tổ chức, bố trí lực lượng, tiềm lực mọi mặt của đất nước và của toàn dân trên toàn bộ lãnh thổ theo yêu cầu của quốc phòng, an ninh, bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Sự tổ chức, bố trí lực lượng, vũ khí, phương tiện kỹ thuật của đất nước và của toàn dân trên toàn bộ lãnh thổ theo yêu cầu của quốc phòng, an ninh, bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Sự tổ chức, bố trí lực lượng, tiềm lực kinh tế, đối ngoại của đất nước và của toàn dân trên toàn bộ lãnh thổ theo yêu cầu của quốc phòng, an ninh, bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.","Sự tổ chức, bố trí lực lượng, tiềm lực quân sự của đất nước và của toàn dân trên toàn bộ lãnh thổ theo yêu cầu của quốc phòng, an ninh, bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa."],"A",""],
[3,16,"Nội dung xây dựng thế trận quốc phòng toàn dân, an ninh nhân dân gồm:",["Phân vùng chiến lược về quốc phòng, an ninh kết hợp với vùng kinh tế trên cơ sở quy hoạch các vùng kinh tế theo nguyên tắc bảo vệ đi đôi với xây dựng đất nước.","Phân vùng chiến lược về quốc phòng, an ninh kết hợp với vùng kinh tế trên cơ sở quy hoạch các vùng dân cư theo nguyên tắc bảo vệ đi đôi với xây dựng đất nước.","Phân vùng chiến lược về quân sự kết hợp với vùng kinh tế trên cơ sở quy hoạch các vùng dân cư theo nguyên tắc bảo vệ đi đôi với xây dựng đất nước.","Phân vùng chiến lược về chính trị kết hợp với vùng kinh tế trên cơ sở quy hoạch các vùng dân cư theo nguyên tắc bảo vệ đi đôi với xây dựng đất nước."],"B",""],
[3,17,"Đặc trưng vì dân, của dân, do dân của nền quốc phòng, an ninh nước ta là:",["Thể hiện kinh nghiệm của dân tộc ta trong lịch sử dựng nước và giữ nước.","Thể hiện truyền thống của dân tộc ta trong lịch sử dựng nước và giữ nước.","Thể hiện truyền thống, kinh nghiệm của các nước trên thế giới.","Thể hiện truyền thống, kinh nghiệm của dân tộc ta trong lịch sử dựng nước và giữ nước."],"D",""],
[3,18,"Sức mạnh tổng hợp của nền quốc phòng, an ninh nước ta tạo thành bởi những yếu tố nào?",["Chính trị, kinh tế, văn hoá, khoa học, quân sự, an ninh","Chính trị, kinh tế, văn hoá, tư tưởng, khoa học, quân sự","Chính trị, kinh tế, văn hoá, tư tưởng, khoa học, quân sự, an ninh","Chính trị, kinh tế, tư tưởng, khoa học, quân sự, an ninh"],"C",""],
[3,19,"Một trong những nội dung của đặc trưng nền quốc phòng toàn dân, an ninh nhân dân được xây dựng toàn diện và từng bước hiện đại là:",["Xây dựng quân đội nhân dân, công an nhân dân từng bước hiện đại.","Xây dựng đội ngũ tri thức từng bước hiện đại.","Xây dựng và phát triển nền công nghiệp từng bước hiện đại.","Xây dựng và phát triển nền nông nghiệp từng bước hiện đại."],"A",""],
[3,20,"Một trong những nhiệm vụ xây dựng nền quốc phòng toàn dân, an ninh nhân dân vững mạnh hiện nay là:",["Xây dựng lực lượng quốc phòng, an ninh đáp ứng yêu cầu bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa.","Xây dựng nền công nghiệp quốc phòng, an ninh vững mạnh.","Xây dựng nền nông nghiệp, công nghiệp theo hướng hiện đại. Lấy công nghiệp nặng làm then chốt.","Xây dựng và đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước."],"A",""],
[3,21,"Lực lượng vũ trang nhân dân bao gồm những lực lượng nào?",["Quân đội nhân dân, dân quân tự vệ, công an nhân dân.","Quân đội nhân dân, dân quân tự vệ, dân phòng","Bộ đội chủ lực, bộ đội địa phương, dân quân tự vệ.","Bộ đội địa phương, dân quân tự vệ, dân phòng."],"A",""],
[3,22,"Xây dựng nền quốc phòng toàn dân, an ninh nhân dân là trách nhiệm của:",["Quân đội","Toàn dân","Công an","Quân đội, Công an"],"B",""],
[3,23,"Tiềm lực quân sự, an ninh được biểu hiện ở:",["Khả năng sử dụng vũ khí, phương tiện kỹ thuật trong suốt quá trình đấu tranh bảo vệ Tổ quốc.","Khả năng duy trì và không ngừng phát triển trình độ sẵn sàng chiến đấu, năng lực và sức mạnh chiến đấu của các lực lượng vũ trang nhân dân.","Khả năng sẵn sàng chiến đấu, năng lực và tăng cường sức mạnh chiến đấu.","Khả năng sử dụng vũ khí, phương tiện kỹ thuật, vận dụng các hình thức đánh địch trong tiến công và phòng ngự."],"B",""],
[3,24,"Quốc phòng toàn dân là nền quốc phòng mang tính chất:",["“vì dân, của dân”","“do dân, của dân”","“vì dân, do dân, của dân”","“vì dân, do dân”"],"C",""],
[3,25,"Trong các tiềm lực quốc phòng, an ninh của nước ta thì tiềm lực nào là nhân tố cơ bản tạo nên sức mạnh của quốc phòng, an ninh, có tác động to lớn đến hiệu quả xây dựng và sử dụng các tiềm lực khác?",["Tiềm lực khoa học công nghệ","Tiềm lực kinh tế","Tiềm lực quân sự, an ninh","Tiềm lực chính trị, tinh thần"],"D",""],
[3,26,"Xây dựng tiềm lực khoa học công nghệ của nền quốc phòng toàn dân, an ninh nhân dân là:",["Tạo nên khả năng huy động đội ngũ cán bộ phục vụ quốc phòng, an ninh.","Tạo nên khả năng về vũ khí trang bị để phòng thủ đất nước.","Tạo nên khả năng về khoa học, công nghệ của quốc gia có thể khai thác, huy động phục vụ cho quốc phòng, an ninh","Tạo nên khả năng ứng dụng kết quả nghiên cứu khoa học công nghệ vào quốc phòng, an ninh."],"C",""],
[3,27,"Một trong những nội dung xây dựng thế trận quốc phòng toàn dân, an ninh nhân dân vững chắc là:",["Xây dựng khối đại đoàn kết quân dân để bảo đảm công tác quốc phòng, an ninh.","Xây dựng các vùng kinh tế phát triển.","Xây dựng các tổ chức xã hội với phát triển kinh tế.","Xây dựng hậu phương, tạo chỗ dựa vững chắc cho thế trận quốc phòng, an ninh."],"D",""],
[3,28,"Bổ sung cụm từ phù hợp nhất cho câu sau: “Xây dựng lực lượng quốc phòng, an ninh là …………. đáp ứng yêu cầu của quốc phòng, an ninh, bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa.”",["Xây dựng các tổ chức xã hội với xây dựng hậu phương vững chắc.","Xây dựng các tổ chức xã hội và lực lượng vũ trang nhân dân","Xây dựng lực lượng chính trị và các tổ chức xã hội","Xây dựng lực lượng chính trị và lực lượng vũ trang nhân dân"],"D",""],
[3,29,"Một trong những đặc trưng của nền quốc phòng toàn dân, an ninh nhân dân của ta là:",["Nền quốc phòng toàn dân, an ninh nhân dân được xây dựng và phát triển các vùng biên giới trọng điểm.","Nền quốc phòng toàn dân, an ninh nhân dân được xây dựng cho những vùng kinh tế trọng điểm và từng bước hiện đại.","Nền quốc phòng toàn dân, an ninh nhân dân được xây dựng vững chắc các tuyến biên giới và từng bước hiện đại.","Nền quốc phòng toàn dân, an ninh nhân dân được xây dựng toàn diện và từng bước hiện đại."],"D",""],
[3,30,"Một trong những đặc trưng của nền quốc phòng toàn dân, an ninh nhân dân của ta là:",["Nền quốc phòng toàn dân gắn chặt với phát triển giáo dục.","Nền quốc phòng toàn dân gắn chặt với nền an ninh nhân dân.","Nền quốc phòng toàn dân gắn chặt với phát triển vũ khí trang bị.","Nền quốc phòng toàn dân gắn chặt với phát triển kinh tế."],"B",""],
[3,31,"Bổ sung cụm từ phù hợp nhất cho khái niệm tiềm lực kinh tế: “Tiềm lực kinh tế của nền quốc phòng toàn dân, an ninh nhân dân là khả năng về kinh tế của đất nước có thể …….., ……… nhằm phục vụ cho quốc phòng, an ninh.”",["quản lý, điều hành","tổ chức, điều hành","quản lý, huy động","khai thác, huy động"],"D",""],
[3,32,"Bổ sung cụm từ phù hợp nhất cho khái niệm tiềm lực quân sự: “Tiềm lực quân sự, an ninh của nền quốc phòng toàn dân, an ninh nhân dân là khả năng về …….. có thể huy động tạo thành sức mạnh phục vụ cho nhiệm vụ quân sự, an ninh, cho chiến tranh.”",["vật lực và tinh thần","vật chất và tinh thần","vũ khí và phương tiện kỹ thuật","vũ lực và phương tiện kỹ thuật"],"B",""],
[3,33,"Một trong những nội dung cần tập trung xây dựng tiềm lực chính trị, tinh thần của nền quốc phòng toàn dân, an ninh nhân dân là:",["Xây dựng tình yêu quê hương, đất nước, niềm tin đối với sự lãnh đạo của Đảng, quản lí của Nhà nước, đối với chế độ xã hội chủ nghĩa.","Xây dựng lực lượng vũ trang nhân dân vững mạnh toàn diện, gắn quá trình công nghiệp hóa, hiện đại hóa đất nước với quá trình tăng cường vũ khí trang bị cho các lực lượng vũ trang nhân dân, xây dựng đội ngũ cán bộ trong lực lượng vũ trang nhân dân đáp ứng yêu cầu bảo vệ Tổ quốc trong tình hình mới","Xây dựng số lượng, chất lượng đội ngũ cán bộ kĩ thuật, cơ sở vật chất kĩ thuật có thể huy động phục vụ cho quốc phòng, an ninh.","Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước, xây dựng nền kinh tế độc lập, tự chủ. Kết hợp chặt chẽ phát triển kinh tế - xã hội với tăng cường quốc phòng, an ninh."],"A",""],
[3,34,"Xây dựng tiềm lực kinh tế của nền quốc phòng toàn dân, an ninh nhân dân, cần tập trung vào nội dung nào?",["Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước, xây dựng nền kinh tế độc lập, tự chủ.","Phát triển toàn diện các ngành, các lĩnh vực kinh tế.","Không ngừng cải thiện đời sống vật chất, tinh thần cho các lực lượng vũ trang.","Có kế hoạch chuyển sản xuất từ thời bình sang thời chiến."],"A",""],
[4,1,"Chiến tranh nhân dân Việt Nam?",["Là quá trình sử dụng tiềm lực quốc phòng an ninh để ứng phó với mọi tình huống chiến tranh.","Là quá trình sử dụng tiềm lực quốc phòng an ninh để xây dựng đất nước, đẩy mạnh công nghiệp hoá, hiện đại hoá.","Là quá trình sử dụng tiềm lực của đất nước để xây dựng và đi lên chủ nghĩa xã hội.","Là quá trình sử dụng tiềm lực của đất nước, nhất là tiềm lực quốc phòng an ninh, nhằm đánh bại ý đồ xâm lược lật đổ của kẻ thù đối với cách mạng nước ta."],"D",""],
[4,2,"Đối tượng tác chiến của chiến tranh nhân dân bảo vệ Tổ quốc là:",["Các thế lực thù địch có hành động phá hoại, xâm lược, lật đổ cách mạng.","Các thế lực thù địch cấu kết với các thế lực bên ngoài.","Chủ nghĩa dân tộc hẹp hòi và chủ nghĩa nước lớn.","Chủ nghĩa khủng bố và ly khai cực đoan."],"A",""],
[4,3,"Một trong những âm mưu, thủ đoạn chủ yếu của kẻ thù khi xâm lược nước ta là:",["Đánh chắc, tiến chắc kết hợp sử dụng hỏa lực bắn phá một số nơi.","Sử dụng các biện pháp phi vũ trang, kết hợp bạo loạn lật đổ từ bên trong.","Thực hiện đánh nhanh, thắng nhanh, kết hợp tiến công quân sự từ bên ngoài vào với hành động bạo loạn, lật đổ từ bên trong.","Tổ chức phong tỏa kết hợp hỏa lực bắn phá một số khu vực trọng điểm."],"C",""],
[4,4,"“Tiến hành chiến tranh nhân dân toàn dân đánh giặc lấy lực lượng vũ trang nhân dân làm nòng cốt kết hợp tác chiến của lực lượng vũ trang địa phương với tác chiến của các binh đoàn chủ lực”. Được xác định là:",["Tính chất.","Quan điểm.","Mục đích.","Biện pháp."],"B",""],
[4,5,"Khi tiến hành chiến tranh xâm lược, địch có điểm mạnh:",["Chúng được sự đồng tình ủng hộ của nhân dân trong nước.","Chúng có sức mạnh quân sự, kinh tế, tiềm lực khoa học công nghệ.","Chúng tiến hành chiến tranh với mục đích mở rộng lãnh thổ.","Chúng được sự chi viện giúp đỡ, chi viện của các nước khác."],"B",""],
[4,6,"Khi tiến hành chiến tranh xâm lược, địch có điểm yếu:",["Tiềm lực quân sự, kinh tế, khoa học công nghệ còn hạn chế.","Đây là cuộc chiến tranh phi nghĩa, chắc chắn bị nhân loại phản đối.","Khi tiến hành chiến tranh không lôi kéo được lực lượng phản động nội địa","Trình độ tác chiến, phương tiện kĩ thuật thô sơ."],"B",""],
[4,7,"Một trong những tính chất của chiến tranh nhân dân Việt Nam bảo vệ Tổ quốc?",["Lịch sử chứng minh: nhân dân ta tiến hành cuộc kháng chiến toàn diện, đấu tranh với địch trên nhiều mặt trận nhờ đó mà thắng lợi, giành và giữ nền độc lập dân tộc.","Chiến tranh diễn ra khẩn trương, quyết liệt, phức tạp ngay từ đầu và trong suốt quá trình chiến tranh.","Không ngừng nghiên cứu các cuộc chiến tranh trên thế giới, nghiên cứu nghệ thuật quân sự để phát triển nghệ thuật quân sự lên tầm cao mới.","Là cuộc chiến tranh nhân dân toàn dân, toàn diện, lấy lực lượng vũ trang ba thứ quân làm nòng cốt, dưới sự lãnh đạo của Đảng Cộng sản Việt Nam."],"D",""],
[4,8,"Có bao nhiêu quan điểm của Đảng trong chiến tranh nhân dân bảo vệ Tổ quốc?",["6 quan điểm","7 quan điểm","4 quan điểm","5 quan điểm"],"A",""],
[4,9,"Một trong những quan điểm của Đảng về chiến tranh nhân dân bảo vệ Tổ quốc?",["Không ngừng nghiên cứu các cuộc chiến tranh trên thế giới, nghiên cứu nghệ thuật quân sự để phát triển nghệ thuật quân sự lên tầm cao mới. Xây dựng khu vực phòng thủ vững chắc.","Lịch sử chứng minh nhân dân ta tiến hành cuộc kháng chiến toàn diện, đấu tranh với địch trên nhiều mặt trận nhờ đó mà thắng lợi, giành và giữ nền độc lập dân tộc.","Phải vận dụng sáng tạo nhiều hình thức và biện pháp đấu tranh, có nghệ thuật chỉ đạo và phối hợp chặt chẽ, song, phải luôn lấy đấu tranh quân sự là chủ yếu, lấy thắng lợi trên chiến trường là yếu tố quyết định để kết thúc chiến tranh.","Tiến hành chiến tranh toàn diện, kết hợp chặt chẽ giữa đấu tranh quân sự, chính trị, ngoại giao, kinh tế, văn hóa và tư tưởng, lấy đấu tranh quân sự là chủ yếu, lấy thắng lợi trên chiến trường là yếu tố quyết định để giành thắng lợi trong chiến tranh."],"D",""],
[4,10,"Một trong những quan điểm của Đảng về chiến tranh nhân dân bảo vệ Tổ quốc?",["Cuộc chiến tranh xâm lược nước ta, kẻ thù sẽ tiến công từ bên ngoài vào với hành động bạo loạn lật đổ từ bên trong, thực hiện đánh nhanh, giải quyết nhanh buộc ta phải khuất phục.","Xây dựng khu vực phòng thủ mạnh toàn diện, có khả năng độc lập tác chiến, phối hợp với lực lượng chủ lực, đơn vị bạn đánh địch liên tục dài ngày.","Trong quá trình chuẩn bị lực lượng vũ trang phải có kế hoạch, phương án chiến đấu và được quán triệt tới mọi người, kết hợp giải quyết tốt các tình huống chiến đấu diễn ra.","Kết hợp kháng chiến với xây dựng, vừa kháng chiến vừa xây dựng, ra sức sản xuất thực hành tiết kiệm giữ gìn và bồi dưỡng lực lượng ta càng đánh càng mạnh."],"D",""],
[4,11,"Một trong những biện pháp của quan điểm “Tiến hành chiến tranh nhân dân, toàn dân đánh giặc lấy lực lượng vũ trang nhân dân làm nòng cốt. Kết hợp tác chiến của lực lượng vũ trang địa phương với tác chiến của các binh đoàn chủ lực”.",["Chuẩn bị mọi mặt trên cả nước cũng như từng khu vực, đủ sức đánh được lâu dài, ra sức tạo thời cơ, nắm vững thời cơ, chủ động đối phó và giành thắng lợi trong thời gian cần thiết.","Phải vận dụng sáng tạo nhiều hình thức và biện pháp đấu tranh, có nghệ thuật chỉ đạo và phối hợp chặt chẽ, song, phải luôn lấy đấu tranh quân sự là chủ yếu.","Trong chiến tranh phải vừa kháng chiến, vừa duy trì và đẩy mạnh sản xuất đảm bảo nhu cầu vật chất kỹ thuật cho chiến tranh, ổn định đời sống nhân dân","Không ngừng chăm lo xây dựng các lực lượng vũ trang vững mạnh toàn diện, đặc biệt chất lượng về chính trị."],"D",""],
[4,12,"Chiến tranh nhân dân Việt Nam bảo vệ Tổ quốc xã hội chủ nghĩa trong tình hình mới gồm?",["6 đặc điểm.","5 đặc điểm.","4 đặc điểm.","3 đặc điểm."],"C",""],
[4,13,"Nội dung chủ yếu của chiến tranh nhân dân bảo vệ Tổ quốc gồm?",["5 nội dung","2 nội dung","3 nội dung","4 nội dung"],"C",""],
[4,14,"Sau khi thất bại trong chiến dịch Điện Biên Phủ, thực dân Pháp phải kí hiệp định?",["Hiệp định sơ bộ.","Hiệp định Paris.","Hiệp định Giơ-ne-vơ.","Hiệp định hòa hoãn."],"C",""],
[4,15,"Sau khi thất bại trong chiến dịch Điện Biên Phủ trên không. Đế quốc Mĩ phải kí hiệp định?",["Hiệp định Paris.","Hiệp định Giơ-ne-vơ.","Hiệp định hòa hoãn.","Hiệp định sơ bộ."],"A",""],
[4,16,"Một trong những nội dung chủ yếu của chiến tranh nhân dân bảo vệ Tổ quốc là:",["Tổ chức triển khai đội hình phòng thủ.","Tổ chức thế trận chiến tranh nhân dân.","Tổ chức xây dựng kế hoạch tác chiến.","Tổ chức xây dựng phương án tác chiến."],"B",""],
[4,17,"Một trong những nội dung chủ yếu của chiến tranh nhân dân bảo vệ Tổ quốc là:",["Thế trận chiến tranh bố trí rộng trên cả nước nhưng phải có trọng tâm trọng điểm.","Lực lượng toàn dân được tổ chức chặt chẽ thành lực lượng quần chúng rộng rãi và lực lượng quân sự.","Phối hợp chặt chẽ chống quân địch tiến công từ bên ngoài vào và bạo loạn lật đổ từ bên trong.","Xây dựng lực lượng vũ trang vững mạnh toàn diện, coi trọng cả số lượng và chất lượng."],"B",""],
[4,18,"Trong nội dung chiến tranh nhân dân, khi tiến hành chiến tranh xâm lược, kẻ địch có những điểm yếu nào?",["Là cuộc chiến tranh mang tính độc lập, tự chủ, tự lực tự cường, dựa vào sức mình là chính, nhưng đồng thời cũng tranh thủ sự ủng hộ, giúp đỡ của nhân dân trên thế giới.","Là cuộc chiến tranh mang tính hiện đại, tuy nhiên lực lượng nhân dân tham gia chiến tranh, phát huy cách đánh giặc phong phú, sáng tạo của nhân dân ta trong suốt quá trình chiến tranh.","Là cuộc chiến tranh chính nghĩa, tự vệ cách mạng, nhằm bảo vệ độc lập chủ quyền, thồng nhất toàn vẹn lãnh thổ, bảo vệ Đảng, bảo vệ nhân dân và chế độ xã hội chủ nghĩa nên được mọi người ủng hộ.","Đây là cuộc chiến tranh phi nghĩa, chắc chắn bị nhân loại phản đối. Dân tộc ta có truyền thống yêu nước, chống xâm lược, chắc chắn sẽ làm cho chúng bị tổn thất nặng nề, đánh bại cuộc chiến tranh xâm lược của địch. Địa hình thời tiết nước ta phức tạp khó khăn cho việc triển khai sử dụng phương tiện, lực lượng."],"D",""],
[4,19,"Một trong những biện pháp của quan điểm: “Tiến hành chiến tranh nhân dân, toàn dân đánh giặc lấy lực lượng vũ trang nhân dân làm nòng cốt. Kết hợp tác chiến của lực lượng vũ trang địa phương với tác chiến của các binh đoàn chủ lực” là:",["Chiến tranh là thử thách toàn diện, cả sức mạnh vật chất và sức mạnh tinh thần của quốc gia, do đó chúng ta phải tiến hành chiến tranh toàn diện.","Đảng phải có đường lối chiến lược, sách lược đúng, tạo thế và lực cho từng mặt trận đấu tranh tạo nên sức mạnh.","Phải vận dụng sáng tạo nhiều hình thức và biện pháp đấu tranh, có nghệ thuật chỉ đạo và phối hợp chặt chẽ.","Tăng cường giáo dục quốc phòng, an ninh cho mọi tầng lớp nhân dân, nhất là thế hệ trẻ nói chung và sinh viên nói riêng."],"D",""],
[4,20,"Một trong những biện pháp của quan điểm: “Tiến hành chiến tranh toàn diện, kết hợp chặt chẽ giữa đấu tranh quân sự, chính trị, ngoại giao, kinh tế, văn hóa và tư tưởng, lấy đấu tranh quân sự là chủ yếu, lấy thắng lợi trên chiến trường là yếu tố quyết định để giành thắng lợi trong chiến tranh”?",["Không ngừng nghiên cứu các cuộc chiến tranh trên thế giới, nghiên cứu nghệ thuật quân sự để phát triển nghệ thuật quân sự lên tầm cao mới. Xây dựng khu vực phòng thủ vững chắc.","Phải vận dụng sáng tạo nhiều hình thức và biện pháp đấu tranh thích hợp trên từng mặt; đồng thời có nghệ thuật chỉ đạo, phối hợp chặt chẽ các mặt trận đấu tranh trong từng giai đoạn cũng như quá trình phát triển của chiến tranh. Song, phải luôn quán triệt, lấy đấu tranh quân sự là chủ yếu, lấy thắng lợi trên chiến trường là yếu tố quyết định để kết thúc chiến tranh.","Lịch sử chứng minh: nhân dân ta tiến hành cuộc kháng chiến toàn diện, đấu tranh với địch trên nhiều mặt trận nhờ đó mà thắng lợi, giành và giữ nền độc lập dân tộc.","Động viên mọi lực lượng tham gia chiến tranh, phát huy cách đánh giặc phong phú, sáng tạo của nhân dân."],"B","Giáo trình trang 40 Mục Biện pháp."],
[4,21,"Một trong những tính chất của chiến tranh nhân dân bảo vệ Tổ quốc?",["Là cuộc chiến tranh cách mạng giành độc lập.","Là cuộc chiến tranh chính nghĩa, tự vệ cách mạng.","Là cuộc chiến tranh chống lại lực lượng phản động bảo vệ Tổ quốc.","Là cuộc chiến tranh sử dụng một lực lượng để bảo vệ chính quyền."],"B",""],
[4,22,"Một trong những quan điểm của Đảng trong chiến tranh nhân dân bảo vệ Tổ quốc?",["Là cuộc chiến tranh chính nghĩa, tự vệ cách mạng, nhằm bảo vệ độc lập chủ quyền, thồng nhất toàn vẹn lãnh thổ, bảo vệ Đảng, bảo vệ nhân dân và chế độ xã hội chủ nghĩa Việt Nam.","Hình thái đất nước được chuẩn bị sẵn sàng, thế trận quốc phòng toàn dân, an ninh nhân dân và chiến tranh nhân dân được củng cố ngày càng vững chắc, có điều kiện để phát huy sức mạnh tổng hợp chủ động đánh địch ngay từ đầu và lâu dài.","Tiến hành chiến tranh nhân dân, toàn dân đánh giặc lấy lực lượng vũ trang nhân dân làm nòng cốt. Kết hợp tác chiến của lực lượng vũ trang địa phương với tác chiến của các binh đoàn chủ lực.","Trong bối cảnh quốc tế có nhiều diễn biến phức tạp, chúng ta tiến hành chiến tranh nhân dân bảo vệ Tổ quốc, nhằm góp phần thực hiện những mục tiêu lớn của thời đại là hòa bình, độc lập dân tộc, dân chủ và tiến bộ xã hội."],"C",""],
[4,23,"Một trong những đặc điểm của chiến tranh nhân dân bảo vệ Tổ quốc?",["Là cuộc chiến tranh chính nghĩa, tự vệ cách mạng, nhằm bảo vệ độc lập chủ quyền, thống nhất toàn vẹn lãnh thổ, bảo vệ Đảng.","Là cuộc chiến tranh xâm lược, phi nghĩa, nhất định sẽ bị nhân loại phản đối lên án.","Chiến tranh diễn ra khẩn trương, quyết liệt, phức tạp ngay từ đầu và trong suốt quá trình chiến tranh.","Địa hình thời tiết nước ta phức tạp khó khăn cho việc triển khai sử dụng lực lượng, phương tiện."],"C",""],
[4,24,"Trong bốn mặt trận sau, mặt trận nào có ý nghĩa quyết định trong chiến tranh.",["Mặt trận quân sự.","Mặt trận chính trị.","Mặt trận ngoại giao.","Mặt trận kinh tế."],"A",""],
[4,25,"Một trong những nội dung tổ chức lực lượng chiến tranh nhân dân là:",["Cuộc chiến tranh xâm lược nước ta, kẻ thù sẽ tiến công từ bên ngoài vào với hành động bạo loạn lật đổ từ bên trong, thực hiện đánh nhanh, giải quyết nhanh.","Có kế hoạch và phương án kịp thời dập tắt bạo loạn, không để thù trong, giặc ngoài cấu kết với nhau.","Lực lượng chiến tranh nhân dân là toàn dân đánh giặc, đánh giặc toàn diện, lấy lực lượng vũ trang nhân dân gồm ba thứ quân làm nòng cốt.","Chúng ta phải giữ vững ổn định chính trị, có kế hoạch và phương án kịp thời dập tắt bạo loạn, không để kẻ thù trong, giặc ngoài kết cấu với nhau."],"C",""],
[4,26,"Là cuộc chiến tranh toàn dân, toàn diện, lấy lực lượng vũ trang nhân dân gồm ba thứ quân làm nòng cốt dưới sự lãnh đạo của Đảng. Được xác định là:",["Quan điểm.","Biện pháp.","Tính chất.","Mục đích."],"C",""],
[4,27,"“Thần tốc, thần tốc hơn nữa; táo bạo, táo bạo hơn nữa; tranh thủ từng phút từng giờ; xốc tới mặt trận; giải phóng miền Nam. Quyết chiến quyết thắng”. Câu nói này của ai?",["Đại tướng Võ Nguyên Giáp","Đại tướng Văn Tiến Dũng","Chủ tịch Hồ Chí Minh","Đại tướng Nguyễn Chí Thanh"],"A",""],
[4,28,"Chiến dịch Điện Biên Phủ do đồng chí Võ Nguyên Giáp chỉ huy kết thúc vào ngày tháng năm nào?",["14/05/1954","07/05/1954","15/07/1954","05/07/1954"],"B",""],
[4,29,"Lời kêu gọi toàn quốc kháng chiến: “Bất kì đàn ông, đàn bà, bất kì người già, người trẻ, không chia tôn giáo, đảng phái, dân tộc, hễ là người Việt Nam thì đứng lên đánh thực dân Pháp, cứu Tổ quốc”. Lời kêu gọi của ai?",["Chủ tịch Hồ Chí Minh.","Đại tướng Võ Nguyên Giáp.","Đại tướng Nguyễn Chí Thanh.","Đại tướng Văn Tiến Dũng."],"A",""],
[4,30,"Điền vào chỗ trống sao cho phù hợp với khái niệm chiến tranh nhân dân Việt Nam. “Chiến tranh nhân dân Việt Nam là quá trình sử dụng tiềm lực của đất nước, nhất là…………………, nhằm đánh bại ý đồ xâm lược lật đổ của kẻ thù đối với cách mạng nước ta…”",["Tiềm lực khoa học và công nghệ","Tiềm lực quốc phòng, an ninh","Tiềm lực chính trị","Tiềm lực kinh tế."],"B",""],
[4,31,"Đối tượng tác chiến của chiến tranh nhân dân bảo vệ Tổ quốc là:",["Chủ nghĩa dân tộc hẹp hòi và các thế lực ngầm.","Chủ nghĩa tư bản và một số nước bất đồng quan điểm.","Chủ nghĩa đế quốc và các thế lực phản động.","Chủ nghĩa khủng bố và ly khai cực đoan."],"C",""],
[4,32,"Trong tổ chức lực lượng chiến tranh nhân dân bảo vệ Tổ quốc, lực lượng vũ trang phải được xây dựng:",["Cách mạng, chính quy, tinh nhuệ, từng bước hiện đại, sẵn sàng chiến đấu cao, đáp ứng yêu cầu nhiệm vụ.","Hùng mạnh, vũ khí trang bị hiện đại, coi trọng chất lượng, lấy xây dựng chính trị làm cơ sở.","Vững mạnh về mọi mặt, có bản lĩnh chính trị vững vàng, kỷ luật nghiêm minh, sẵn sàng chiến đấu cao.","Vững mạnh toàn diện, coi trọng cả số lượng và chất lượng, lấy chất lượng là chính, lấy xây dựng chính trị làm cơ sở"],"D",""],
[4,33,"Chiến dịch Điện Biên Phủ diễn ra trong bao nhiêu ngày đêm?",["57 ngày đêm.","56 ngày đêm.","54 ngày đêm.","55 ngày đêm."],"B",""],
[5,1,"Quân đội nhân dân Việt Nam chịu sự chỉ đạo trực tiếp của cấp ủy Đảng nào?",["Đảng ủy trung ương.","Đảng ủy quân sự Bộ Quốc phòng.","Đảng ủy lực lượng vũ trang.","Đảng ủy quân sự Trung ương."],"D",""],
[5,2,"Chức danh nào sau đây thống lĩnh các lực lượng vũ trang nhân dân Việt Nam?",["Tổng bí thư.","Thủ tướng chính phủ.","Chủ tịch nước.","Bộ trưởng Bộ quốc phòng."],"C",""],
[5,3,"Thực trạng của lực lượng vũ trang nhân dân ta hiện nay là:",["Trang bị của lực lượng vũ trang đáp ứng yêu cầu của tác chiến hiện đại.","Trang bị của lực lượng vũ trang còn lạc hậu và thiếu đồng bộ.","Trang bị của lực lượng vũ trang tương đối hiện đại.","Trang bị của lực lượng vũ trang đáp ứng yêu cầu các quân, binh chủng."],"B",""],
[5,4,"Trình độ chính quy của quân đội và công an hiện nay?",["Chưa đáp ứng được yêu cầu tác chiến hiện đại.","Chủ động và đáp ứng yêu cầu của tác chiến hiện đại.","Đáp ứng một phần khi có chiến tranh xảy ra.","Đáp ứng yêu cầu và nhiệm vụ trong xây dựng nền quốc phòng toàn dân, chiến tranh nhân dân."],"A",""],
[5,5,"Giữ vững và tăng cường sự lãnh đạo của Đảng Cộng sản Việt Nam đối với lực lượng vũ trang nhân dân là:",["Phương hướng chung xây dựng lực lượng vũ trang nhân dân.","Biện pháp xây dựng lực lượng vũ trang nhân dân.","Phương châm xây dựng lực lượng vũ trang nhân dân.","Quan điểm, nguyên tắc cơ bản xây dựng lực lượng vũ trang nhân dân."],"D",""],
[5,6,"Tự lực tự cường xây dựng lực lượng vũ trang là:",["Quan điểm, nguyên tắc cơ bản xây dựng lực lượng vũ trang nhân dân.","Nhiệm vụ xây dựng lực lượng vũ trang nhân dân.","Biện pháp xây dựng lực lượng vũ trang nhân dân.","Phương hướng xây dựng lực lượng vũ trang nhân dân."],"A",""],
[5,7,"Bảo đảm cho lực lượng vũ trang nhân dân luôn trong tư thế sẵn sàng chiến đấu và chiến đấu thắng lợi là:",["Quan điểm, nguyên tắc cơ bản xây dựng lực lượng vũ trang nhân dân.","Biện pháp xây dựng lực lượng vũ trang nhân dân.","Nhiệm vụ xây dựng lực lượng vũ trang nhân dân.","Phương hướng xây dựng lực lượng vũ trang nhân dân."],"A",""],
[5,8,"Xây dựng lực lượng vũ trang nhân dân lấy chất lượng là chính, lấy xây dựng chính trị làm cơ sở là:",["Biện pháp xây dựng lực lượng vũ trang nhân dân.","Nhiệm vụ xây dựng lực lượng vũ trang nhân dân.","Phương hướng xây dựng lực lượng vũ trang nhân dân.","Quan điểm, nguyên tắc cơ bản xây dựng lực lượng vũ trang nhân dân."],"D",""],
[5,9,"Truyền thống xây dựng lực lượng vũ trang của ông cha ta “binh quý hồ tinh, bất quý hồ đa” có ý nghĩa gì?",["Số lượng quan trọng hơn chất lượng.","Chất lượng và số lượng phù hợp qua từng giai đoạn cụ thể.","Mối tương quan giữa số lượng và chất lượng.","Chất lượng quan trọng hơn số lượng."],"D",""],
[5,10,"Phương hướng chung xây dựng lực lượng vũ trang nhân dân Việt Nam trong giai đoạn mới là:",["Xây dựng quân đội, công an nhân dân theo hướng cách mạng, chính quy, rộng khắp, từng bước hiện đại.","Xây dựng quân đội, công an nhân dân theo hướng cách mạng, chính quy, tinh nhuệ, từng bước hiện đại.","Xây dựng quân đội, công an nhân dân theo hướng cách mạng, chính quy, tinh nhuệ, từng bước hiện đại, được huấn luyện tốt.","Xây dựng quân đội, công an nhân dân theo hướng vững mạnh, tinh nhuệ, từng bước hiện đại."],"B",""],
[5,11,"Một trong những phương hướng chung xây dựng lực lượng vũ trang nhân dân Việt Nam trong giai đoạn mới là:",["Xây dựng dân quân tự vệ rộng khắp, lấy chất lượng làm chính, lấy xây dựng chính trị làm cơ sở.","Xây dựng dân quân tự vệ vững mạnh, rộng khắp, lấy chất lượng làm chính.","Xây dựng dân quân tự vệ vững mạnh, rộng khắp, chất lượng cao.","Xây dựng dân quân tự vệ vững mạnh, rộng khắp, lấy xây dựng chính trị làm cơ sở."],"B",""],
[5,12,"Xây dựng quân đội, công an nhân dân theo hướng chính quy là:",["Thực hiện thống nhất về mọi mặt.","Thực hiện thống nhất về phương châm hành động.","Thực hiện thống nhất về mục tiêu chiến đấu.","Thực hiện thống nhất phương hướng chiến đấu."],"A",""],
[5,13,"Xây dựng quân đội, công an nhân dân theo hướng tinh nhuệ là:",["Hoạt động của quân đội, công an về tư tưởng đạt hiệu quả cao.","Hoạt động của quân đội, công an về kỹ chiến thuật đạt hiệu quả cao.","Hoạt động của quân đội, công an về tổ chức đạt hiệu quả cao.","Mọi hoạt động của quân đội, công an trên các lĩnh vực đạt hiệu quả cao."],"D",""],
[5,14,"Tinh nhuệ về tổ chức trong xây dựng quân đội, công an nhân dân hiện nay là:",["Tổ chức đảm bảo tính hiệu quả trong tác chiến.","Tổ chức lực lượng đảm bảo tính cơ động, linh hoạt.","Tổ chức gọn, nhẹ nhưng vẫn đáp được ứng yêu cầu nhiệm vụ được giao.","Tổ chức lực lượng yêu cầu cao về vũ khí trang bị."],"C",""],
[5,15,"Một trong những biện pháp chủ yếu xây dựng lực lượng vũ trang nhân dân?",["Thường xuyên thực hiện giáo dục quốc phòng và an ninh.","Xây dựng đội ngũ cán bộ lực lượng vũ trang nhân dân có phẩm chất, năng lực tốt.","Phát huy sức mạnh tổng hợp trên địa bàn để xây dựng lực lượng.","Tăng cường sự lãnh đạo của Đảng, sự quản lý của Nhà nước."],"B",""],
[5,16,"Nâng cao chất lượng huấn luyện, giáo dục, xây dựng và phát triển khoa học quân sự, khoa học công an được xác định là:",["Nhiệm vụ xây dựng lực lượng vũ trang nhân dân.","Quan điểm, nguyên tắc cơ bản xây dựng lực lượng vũ trang nhân dân.","Biện pháp chủ yếu xây dựng lực lượng vũ trang nhân dân.","Phương hướng xây dựng lực lượng vũ trang nhân dân."],"C",""],
[5,17,"“Lực lượng vũ trang nhân dân là …...(1) ……..và ……..(2)……..do Đảng cộng sản Việt Nam lãnh đạo, Nhà nước CHXHCNVN quản lý”.",["tiềm lực vũ trang (1); tiềm lực bán vũ trang (2).","các lực lượng vũ trang (1); bán vũ trang (2).","các tổ chức vũ trang (1); bán vũ trang (2).","tiềm lực quốc phòng (1); thế trận quốc phòng (2)."],"C",""],
[5,18,"Một trong những nhiệm vụ chủ yếu của lực lượng vũ trang nhân dân là:",["Chiến đấu giành và giữ độc lập, chủ quyền thống nhất và toàn vẹn lãnh thổ của Tổ quốc.","Tổ chức lực lượng quần chúng rộng rãi, xây dựng nền quốc phòng toàn dân, an ninh nhân dân.","Tổ chức lực lượng chiến tranh nhân dân và thế trận chiến tranh nhân dân.","Phối hợp chặt chẽ chống quân địch tấn công từ bên ngoài vào và bạo loạn lật đổ từ bên trong."],"A",""],
[5,19,"Bảo vệ an ninh quốc gia, trật tự an toàn xã hội, bảo vệ nhân dân, bảo vệ chế độ xã hội chủ nghĩa và những thành quả cách mạng là:",["Nhiệm vụ của lực lượng vũ trang nhân dân.","Phương hướng xây dựng lực lượng vũ trang nhân dân.","Biện pháp xây dựng lực lượng vũ trang nhân dân.","Quan điểm, nguyên tắc xây dựng lực lượng vũ trang nhân dân."],"A",""],
[5,20,"Một trong những nhiệm vụ chủ yếu của lực lượng vũ trang nhân dân Việt Nam?",["Là lực lượng chuyên trách trong khởi nghĩa giành chính quyền, xây dựng nền quốc phòng toàn dân, an ninh nhân dân và chiến tranh nhân dân.","Là lực lượng nòng cốt trong khởi nghĩa giành chính quyền, xây dựng nền quốc phòng toàn dân, an ninh nhân dân và chiến tranh nhân dân.","Là lực lượng dự bị trong khởi nghĩa giành chính quyền, xây dựng nền quốc phòng toàn dân, an ninh nhân dân và chiến tranh nhân dân.","Là lực lượng chủ lực trong khởi nghĩa giành chính quyền, xây dựng nền quốc phòng toàn dân, an ninh nhân dân và chiến tranh nhân dân."],"B",""],
[5,21,"Một trong những đặc điểm chính liên quan đến xây dựng lực lượng vũ trang nhân dân là:",["Bảo vệ chế độ xã hội chủ nghĩa và những thành quả cách mạng trong điều kiện quốc tế đã thay đổi, có nhiều diễn biến phức tạp.","Xây dựng dựng lực lượng vũ trang nhân dân trong điều kiện quốc tế đã thay đổi, có nhiều diễn biến phức tạp.","Xây dựng đất nước và xây dựng nền quốc phòng toàn dân trong điều kiện quốc tế đã thay đổi.","Xây dựng lực lượng chiến tranh nhân dân và thế trận chiến tranh nhân dân trong điều kiện quốc tế đã thay đổi, có nhiều diễn biến phức tạp."],"B",""],
[5,22,"Cả nước đang thực hiện hai nhiệm vụ chiến lược xây dựng và bảo vệ Tổ quốc xã hội chủ nghĩa, trong khi chủ nghĩa đế quốc và các thế lực thù địch vẫn chống phá ta quyết liệt trên mọi lĩnh vực là:",["Quan điểm, nguyên tắc xây dựng lực lượng vũ trang nhân dân.","Nhiệm vụ lực lượng vũ trang nhân dân.","Phương hướng xây dựng lực lượng vũ trang nhân dân.","Đặc điểm liên quan đến xây dựng lực lượng vũ trang nhân dân."],"D",""],
[5,23,"Một trong những đặc điểm chính liên quan đến xây dựng lực lượng vũ trang nhân dân là:",["Chiến tranh cục bộ, chạy đua vũ trang.","Tình hình khu vực và thế giới có nhiều thay đổi.","Thực trạng của lực lượng vũ trang nhân dân ta.","Xung đột vũ trang, tranh chấp biên giới."],"C",""],
[5,24,"Một trong những đặc điểm chính liên quan đến xây dựng lực lượng vũ trang nhân dân là:",["Sự nghiệp đổi mới đã đạt được nhiều thành tựu to lớn, đất nước ta đang bước sang thời kỳ công nghiệp hóa - hiện đại hóa và hội nhập kinh tế thế giới toàn diện hơn, đời sống nhân dân ngày càng được cải thiện.","Vị thế của Việt Nam ngày càng nâng lên, đất nước ta đang bước sang thời kỳ công nghiệp hóa - hiện đại hóa và hội nhập kinh tế thế giới toàn diện hơn.","Nền kinh tế nước ta đã đạt được nhiều thành tựu to lớn, đất nước ta đang bước sang thời kỳ công nghiệp hóa - hiện đại hóa và hội nhập kinh tế thế giới toàn diện hơn.","Sự nghiệp đổi mới đã đạt được nhiều thành tựu to lớn, đất nước ta đang bước sang thời kỳ công nghiệp hóa - hiện đại hóa và hội nhập kinh tế thế giới toàn diện hơn."],"D",""],
[5,25,"Để tự lực tự cường xây dựng lực lượng vũ trang nhân dân cần?",["Tích cực ổn định chính trị, an toàn xã hội.","Tích cực ổn định chính trị, an toàn xã hội, đẩy mạnh hợp tác quốc tế.","Tích cực đẩy mạnh phát triển kinh tế và thực hành tiết kiệm.","Tích cực và đẩy mạnh hợp tác quốc tế."],"C",""],
[5,26,"Một trong những phương hướng chung xây dựng lực lượng vũ trang nhân dân Việt Nam trong giai đoạn mới là:",["Xây dựng lực lượng dự bị động viên hùng hậu, được huấn luyện và quản lý tốt, bảo đảm khi cần thiết có thể động viên nhanh theo kế hoạch.","Xây dựng lực lượng dự bị động viên đảm bảo số lượng và quản lý tốt, có thể động viên nhanh theo kế hoạch.","Xây dựng lực lượng dự bị động viên hùng hậu, đáp ứng yêu cầu, nhiệm vụ bảo vệ Tổ quốc trong tình hình mới.","Xây dựng lực lượng dự bị động viên hùng hậu, chất lượng cao và quản lý tốt, sẵn sàng chiến đấu."],"A",""],
[5,27,"Một trong những nội dung xây dựng quân đội cách mạng chính là:",["Xây dựng bản chất giai cấp công nhân cho quân đội.","Xây dựng bản lĩnh và tinh thần chiến đấu cho quân đội.","Xây dựng ý chí quyết tâm cho quân đội.","Xây dựng bản lĩnh chính trị vững vàng cho quân đội."],"A",""],
[5,28,"Một trong những nội dung xây dựng quân đội cách mạng chính là:",["Có tính thống nhất về tổ chức thực hiện chức trách nền nếp chế độ chính quy.","Có tính thống nhất về bản chất cách mạng, mục tiêu chiến đấu.","Có ý chí quyết tâm, nguyên tắc xây dựng quân đội.","Có tinh thần đoàn kết quân dân, đoàn kết nội bộ, đoàn kết quốc tế."],"D",""],
[5,29,"Một trong những nội dung xây dựng quân đội, công an nhân dân theo hướng chính quy là:",["Xây dựng bản chất giai cấp công nhân cho quân đội.","Xây dựng tính kỷ luật tự giác nghiêm minh.","Thống nhất về bản chất cách mạng, mục tiêu chiến đấu.","Kiên định mục tiêu lý tưởng xã hội chủ nghĩa."],"C",""],
[5,30,"Tinh nhuệ về kỹ chiến thuật trong xây dựng quân đội, công an nhân dân hiện nay là:",["Phải giỏi sử dụng các loại binh khí kỹ thuật hiện có.","Phải thể hiện được kỹ năng trong tác chiến độc lập.","Phải giỏi sử dụng một loại vũ khí đặc biệt.","Phải giỏi và linh hoạt xử lý các tình huống."],"A",""],
[5,31,"Giảm lực lượng thường trực và tăng lực lượng dự bị động viên trong quân đội ta hiện nay?",["Giảm gánh nặng ngân sách quốc phòng đồng thời tăng nguồn lực lao động, tạo động lực phát triển kinh tế của nước ta.","Trong thời bình, các nước không cần số lượng lực lượng thường trực quá lớn.","Yêu cầu, nhiệm vụ trong chiến lược phát triển kinh tế của các nước đang phát triển.","Huy động nguồn lực lao động, tạo động lực phát triển kinh tế của các nước."],"B",""],
[5,32,"Một trong những biện pháp chủ yếu xây dựng lực lượng vũ trang nhân dân?",["Phát huy sức mạnh tổng hợp trên địa bàn để xây dựng lực lượng.","Thường xuyên quán triệt sâu rộng các quan điểm, chủ trương, chính sách của Đảng.","Thực hiện cơ chế Đảng lãnh đạo, chính quyền điều hành.","Từng bước giải quyết yêu cầu về vũ khí, trang bị kỹ thuật của lực lượng vũ trang nhân dân."],"D",""],
[5,33,"Một trong những thách thức lớn của nước ta trong xây dựng lực lượng vũ trang nhân dân Việt Nam hiện nay là:",["Khủng bố và tội phạm xuyên quốc gia.","Chiến tranh cục bộ, chạy đua vũ trang.","Tụt hậu xa hơn về kinh tế so với nhiều nước trong khu vực và thế giới.","Xung đột vũ trang, tranh chấp biên giới."],"C",""],
[5,34,"Tư tưởng của Chủ tịch Hồ Chí Minh về tự lực tự cường xây dựng lực lượng vũ trang là:",["Dùng bạo lực cách mạng chống lại bạo lực phản cách mạng của kẻ thù.","Vận dụng phương thức tuyên truyền, vận động.","Vận dụng phương thức tuyên truyền, vận động kết hợp ngoại giao.","Dùng phương thức ngoại giao."],"A",""],
[5,35,"Đảng Cộng sản Việt Nam độc tôn duy nhất nắm quyền lãnh đạo lực lượng vũ trang nhân dân theo nguyên tắc “tuyệt đối, trực tiếp về mọi mặt” là quan điểm, nguyên tắc cơ bản nào sau đây?",["Giữ vững và ổn định sự lãnh đạo của Đảng Cộng sản Việt Nam đối với lực lượng vũ trang nhân dân.","Đảm bảo và tăng cường sự lãnh đạo của Đảng Cộng sản Việt Nam đối với lực lượng vũ trang nhân dân.","Củng cố và tăng cường sự lãnh đạo của Đảng Cộng sản Việt Nam đối với lực lượng vũ trang nhân dân.","Giữ vững và tăng cường sự lãnh đạo của Đảng Cộng sản Việt Nam đối với lực lượng vũ trang nhân dân."],"D",""],
[5,36,"Một trong những nội dung xây dựng quân đội, công an nhân dân theo hướng chính quy là:",["Thống nhất về quan điểm tư tưởng quân sự, nghệ thuật quân sự.","Khắc phục khó khăn, xây dựng đơn vị vững mạnh toàn diện.","Giữ vững tính độc lập, tự chủ.","Chấp hành mọi đường lối của Đảng, chính sách của Nhà nước."],"A",""],
[5,37,"Từng bước hiện đại trong xây dựng quân đội, công an hiện nay là:",["Một kế hoạch chiến lược của Đảng và Nhà nước ta.","Một yếu tố quyết định trong chiến lược xây dựng và bảo vệ Tổ quốc.","Một tất yếu, nhằm nâng cao sức mạnh chiến đấu của quân đội, công an.","Một yêu cầu, mục tiêu quan trọng trong tình hình mới."],"C",""],
[5,38,"Quá trình hiện đại hóa quân đội, công an hiện nay phải?","Gắn với quá trình công nghiệp hóa – hiện đại hóa đất nước.","Gắn với hoạt động đối ngoại của Đảng và Nhà nước ta.","Gắn chặt với xây dựng nền quốc phòng toàn dân, an ninh nhân dân.","Gắn với tinh thần đoàn kết, tính kỷ luật trong xây dựng lực lượng vũ trang.","A",""],
[5,39,"Mục tiêu phi chính trị hóa lực lượng vũ trang nhân dân của:",["Các tổ chức dân chủ, nhân quyền, tổ chức phi chính phủ.","Các thế lực thù địch, phản động đẩy mạnh trong chiến lược “Diễn biến hòa bình” chống phá cách mạng.","Các tổ chức ly khai, đa nguyên, đa đảng.","Các phần tử chống đối, gây rối, phủ nhận vai trò lãnh đạo của Đảng"],"B",""],
[5,40,"Xây dựng lực lượng vũ trang nhân dân Việt Nam có chất lượng toàn diện về?",["Chính trị, tư tưởng, tổ chức.","Chính trị, văn hóa, tư tưởng.","Chính trị, tư tưởng, quân sự, tổ chức.","Chính trị, tư tưởng, văn hóa, tổ chức."],"A",""],
[6,1,"Kế sách nào sau đây không thể hiện tư tưởng về sự kết hợp giữa kinh tế với quốc phòng trong lịch sử?",["Khoan thư sức dân.","Tiên phát chế nhân.","Ngụ binh ư nông.","Động vi binh, tĩnh vi dân."],"B",""],
[6,2,"“Địa bàn sinh sống chủ yếu của đồng bào dân tộc ít người, mật độ dân số thấp, kinh tế chậm phát triển, trình độ dân trí thấp, đời sống dân cư còn nhiều khó khăn” là đặc điểm:",["Của các vùng đồng bằng Sông Hồng.","Của Vùng đồng bằng sông Cửu Long.","Của các dân tộc thiểu số.","Của vùng núi biên giới."],"D",""],
[6,3,"“Mật độ dân cư và tính chất đô thị hóa cao; tập trung các đầu mối giao thông quan trọng, các sân bay, bến cảng, kho tàng” là đặc điểm thuộc lĩnh vực nào?",["Về quốc phòng các vùng kinh tế trọng điểm.","Về an ninh các vùng kinh tế trọng điểm.","Về kinh tế các vùng kinh tế trọng điểm.","Về khoa học công nghệ các vùng kinh tế trọng điểm."],"C",""],
[6,4,"Kinh tế - xã hội quyết định đến việc cung cấp cơ sở vật chất kỹ thuật và sức mạnh của quốc phòng, an ninh. Được xác định là:",["Giải pháp của sự kết hợp kinh tế với quốc phòng, an ninh.","Cơ sở thực tiễn của sự kết hợp kinh tế với quốc phòng, an ninh.","Cơ sở lí luận của sự kết hợp kinh tế với quốc phòng, an ninh.","Nội dung của sự kết hợp kinh tế với quốc phòng, an ninh."],"C",""],
[6,5,"Mặt tiêu cực của hoạt động quốc phòng, an ninh có thể dẫn đến:",["Hủy hoại môi trường sinh thái và để lại hậu quả nặng nề cho nền kinh tế.","Ảnh hưởng đến đường lối phát triển kinh tế, cơ cấu kinh tế.","Tạo môi trường hòa bình ổn định lâu dài.","Phương án a, b đúng."],"D",""],
[6,6,"Bản chất của nền kinh tế - xã hội quyết định đến?",["Bản chất của quốc phòng, an ninh.","Sức mạnh quốc phòng, an ninh.","Sự phát triển của lực lượng vũ trang.","Tiềm lực kinh tế."],"A",""],
[6,7,"Câu nói: “Thắng lợi hay thất bại của chiến tranh đều phụ thuộc vào điều kiện kinh tế,… ” do ai khẳng định?",["Ph. Ăngghen.","C. Mác.","Hồ Chí Minh.","V. I. Lênin."],"A",""],
[6,8,"Nội dung “Khi xây dựng bất cứ công trình nào, ở đâu, quy mô nào cũng phải tính đến yếu tố tự bảo vệ và có thể chuyển hóa phục vụ được cho cả quốc phòng, an ninh, cho phòng thủ tác chiến và phòng thủ dân sự” là sự kết hợp giữa kinh tế với quốc phòng trong lĩnh vực nào sau đây?",["Trong công nghiệp.","Trong giao thông vận tải.","Trong xây dựng cơ bản.","Trong bưu chính viễn thông."],"C",""],
[6,9,"Trong kháng chiến chống thực dân Pháp, để thực hiện tốt sự kết hợp phát triển kinh tế - xã hội với tăng cường củng cố quốc phòng, an ninh. Đảng ta đã đề ra chủ trương?",["Thóc không thiếu một cân, quân không thiếu một người.","Vừa đánh, vừa đàm.","Vừa kháng chiến, vừa kiến quốc.","Tất cả cho tiền tuyến."],"C",""],
[6,10,"Kết hợp phát triển kinh tế - xã hội với tăng cường, củng cố quốc phòng, an ninh trong các vùng lãnh thổ. Được xác định là:",["Cơ sở lý luận của kết hợp kinh tế với quốc phòng.","Thực tiễn của kết hợp kinh tế với quốc phòng.","Giải pháp kết hợp kinh tế với quốc phòng.","Nội dung kết hợp kinh tế với quốc phòng."],"D",""],
[6,11,"Trong quy hoạch, kế hoạch xây dựng các thành phố, các khu công nghiệp cần lựa chọn quy mô trung bình, bố trí phân tán, trải dài trên diện rộng, không nên xây dựng thành những siêu đô thị lớn. Nhằm mục đích?",["Khai thác tiềm năng của từng địa phương.","Thu hút các nhà đầu tư nước ngoài.","Điều chỉnh mật độ dân cư.","Hạn chế thiệt hại khi chiến tranh xảy ra."],"D",""],
[6,12,"Kinh tế là yếu tố quyết định đến nguồn gốc ra đời, sức mạnh của quốc phòng, an ninh vì?",["Kinh tế cung cấp cơ sở vật chất kỹ thuật cho quốc phòng, an ninh.","Kinh tế là yếu tố thúc đẩy đất nước phát triển.","Kinh tế sẽ quyết định đến số lượng quốc phòng, an ninh.","Kinh tế là nguyên nhân làm nảy sinh mâu thuẩn và xung đột xã hội."],"D",""],
[6,13,"Trước khi tìm hiểu về cơ sở lí luận và thực tiễn của việc kết hợp phát triển kinh tế - xã hội với tăng cường, củng cố quốc phòng, an ninh ở Việt Nam thì cần nắm được:",["Khái niệm Kinh tế - xã hội; Quốc phòng; An ninh.","Khái niệm hoạt động kinh tế; Quốc phòng; An ninh.","Khái niệm hoạt Kinh tế; Quốc phòng; trật tự an toàn xã hội.","Khái niệm hoạt động xã hội; Quốc phòng; An ninh."],"B",""],

[7,25,"Mặt trận binh vận có tác dụng để:",["Vận động làm cho kẻ địch lúng túng, bị động, góp phần quan trọng để hạn chế thấp nhất tổn thương của nhân dân ta trong chiến tranh.","Vận động làm tan rã hàng ngũ của giặc, góp phần nhanh chóng làm kết thúc chiến tranh.","Vận động tiếp cận gần địch tiêu diệt địch, góp phần quan trọng để hạn chế thấp nhất tổn thương của nhân dân ta trong chiến tranh.","Vận động làm tan rã hàng ngũ của giặc, góp phần quan trọng để hạn chế thấp nhất tổn thương của nhân dân ta trong chiến tranh."],"D",""],
[7,26,"Một trong những vai trò của mặt trận chính trị trong nghệ thuật kết hợp đấu tranh giữa các mặt trận là:",["Cơ sở để tạo ra sức mạnh quân sự.","Quyết định thắng lợi trực tiếp của chiến tranh.","Phân hoá, cô lập kẻ thù, tạo thế có lợi cho cuộc chiến.","Tạo đà, tạo thế cho các mặt trận khác phát triển."],"A",""],

[7,33,"Nghệ thuật kết hợp đấu tranh giữa các mặt trận quân sự, chính trị, ngoại giao và binh vận của ông cha ta nhằm mục đích?",["Để tạo ra sức mạnh tổng hợp, giành thắng lợi trong chiến tranh.","Để giải quyết nhanh chóng chiến tranh và ngăn chặn nguy cơ chiến tranh xảy ra trên đất nước.","Để nhân dân Việt Nam và các nước trong khu vực ủng hộ cuộc chiến tranh chính nghĩa của dân tộc ta.","Để chống kẻ thù mạnh, ta phải kiên quyết, khôn khéo, triệt để lợi dụng các cơ hội ngoại giao, … giảm tối đa tổn thất trong chiến tranh."],"A",""],

[7,48,"Quan điểm Chủ nghĩa Mác – Lê-nin về chiến tranh quân đội và bảo vệ Tổ quốc là:",["Là chủ trương, đường lối quân sự phù hợp nhất, sát thực nhất đối với cách mạng Việt Nam.","Học thuyết quân sự đúng đắn, khoa học nhất để Việt Nam sử dụng trong chiến tranh bảo vệ Tổ quốc.","Lý luận kinh điển về nghệ thuật quân sự, tư liệu tham khảo cho tư tưởng quân sự Việt Nam.","Cơ sở để Đảng ta vận dụng, định ra đường lối quân sự trong khởi nghĩa vũ trang, chiến tranh giải phóng ở Việt Nam."],"D",""],

[8,12,"Thế nào là chủ quyền quốc gia?",["Là quyền tự quyết định mọi vấn đề đối nội, đối ngoại của quốc gia.","Là quyền làm chủ một cách độc lập, toàn vẹn và đầy đủ về mọi mặt lập pháp, hành pháp và tư pháp của một quốc gia trong phạm vi lãnh thổ quốc gia đó.","Là quyền tối cao của một quốc gia trong phạm vi lãnh thổ của mình.","Là quyền thiêng liêng mọi vấn đề chính trị, kinh tế, văn hoá - xã hội do quốc gia quyết định."],"B",""],
[8,13,"Thế nào là chủ quyền lãnh thổ quốc gia?",["Là quyền thiêng liêng bất khả xâm phạm của một quốc gia, quyết định mọi vấn đề của quốc gia trên vùng lãnh thổ của mình.","Là quyền tối cao, tuyệt đối, riêng biệt đối với quốc gia trên vùng lãnh thổ của mình.","Là một bộ phận của chủ quyền quốc gia, là quyền quyết định mọi vấn đề chính trị, kinh tế, văn hoá, xã hội.","Là một bộ phận của chủ quyền quốc gia, khẳng định quyền làm chủ của quốc gia đó trên vùng lãnh thổ của mình."],"D",""],
[8,14,"Quyền chủ quyền của quốc gia đối với vùng nội thủy là gì?",["Thực hiện quyền chủ quyền, quyền tài phán quốc gia và các quyền khác.","Thực hiện chủ quyền hoàn toàn, tuyệt đối và đầy đủ như trên lãnh thổ đất liền.","Thực hiện chủ quyền đầy đủ và toàn vẹn.","Thực hiện quyền chủ quyền về việc thăm dò, khai thác, quản lý và bảo tồn tài nguyên thuộc vùng nước bên trên đáy biển, đáy biển và lòng đất dưới đáy biển."],"B",""],

[8,29,"Thế nào là lãnh thổ quốc gia đặc biệt?",["Là loại lãnh thổ đặc thù của một quốc gia tồn tại hợp pháp trong lãnh thổ của quốc gia khác hoặc trên vùng biển, vùng trời quốc tế.","Là loại lãnh thổ của một quốc gia tồn tại hợp pháp trong lãnh thổ của quốc gia khác hoặc trên vùng biển, vùng trời quốc tế.","Là loại lãnh thổ riêng biệt của một quốc gia tồn tại hợp pháp trong lãnh thổ của quốc gia khác hoặc trên vùng biển, vùng trời quốc tế.","Là loại lãnh thổ đặc biệt của một quốc gia tồn tại hợp pháp trong lãnh thổ của quốc gia khác hoặc trên vùng biển, vùng trời quốc tế."],"A",""],
[8,30,"Một trong những quan điểm của Đảng và Nhà nước ta về Biển, đảo?",["Chủ quyền lãnh thổ, biên giới quốc gia là một bộ phận rất quan trọng của Nhà nước Việt Nam.","Xây dựng lực lượng bảo vệ chủ quyền biển, đảo vững mạnh đáp ứng yêu cầu quản lý, khai thác và bảo vệ chủ quyền biển, đảo Việt Nam trong tình hình mới.","Chủ quyền lãnh thổ, biên giới quốc gia là thiêng liêng bất khả xâm phạm của dân tộc Việt Nam.","Chủ quyền lãnh thổ, biên giới quốc gia là yếu tố cơ bản nhất cho sự phát triển kinh tế - xã hội."],"C",""],

[9,8,"Một trong những quan điểm, nguyên tắc xây dựng lực lượng dự bị động viên là:",["Xây dựng lực lượng dự bị động viên hùng mạnh, trình độ kỹ chiến thuật tốt, sẵn sàng chiến đấu cao.","Phát huy sức mạnh của bộ, ngành và địa phương trong xây dựng lực lượng dự bị động viên.","Phát huy sức mạnh của toàn dân trên tất cả các lĩnh vực hoạt động xã hội.","Phát huy sức mạnh tổng hợp của cả hệ thống chính trị trong xây dựng lực lượng dự bị động viên."],"D",""],

[9,12,"Theo Luật dân quân tự vệ 2019, một trong những nhiệm vụ của lực lượng dân quân tự vệ?",["Thực hiện nhiệm vụ huấn luyện quân sự, giáo dục chính trị, pháp luật, hội thi, hội thao, diễn tập.","Chiến đấu, sẵn sàng chiến đấu trên địa bàn địa phương theo kế hoạch, phương án, khi cần có thể tăng cường cho lực lượng chiến đấu cơ động.","Chiến đấu, tiêu hao, tiêu diệt, chi viện cho lực lượng chiến đấu tại chỗ, khi cần thiết có thể chiến đấu trên địa bàn địa phương khác","Bảo vệ chính quyền, bảo vệ tính mạng, tài sản của nhân dân, tài sản của Nhà nước, làm nòng cốt cùng toàn dân đánh giặc ở địa phương, cơ sở khi có chiến tranh."],"A",""],
[9,13,"Theo Luật dân quân tự vệ năm 2019, lực lượng dân quân tự vệ bao gồm:","5 nhiệm vụ","7 nhiệm vụ","8 nhiệm vụ","6 nhiệm vụ","B",""],
[9,14,"Nhiệm vụ của lực lượng dân quân cơ động là:",["Chiến đấu tại chỗ là chiến đấu, sẵn sàng chiến đấu trên địa bàn địa phương theo kế hoạch, phương án, khi cần có thể tăng cường cho lực lượng chiến đấu cơ động.","Chiến đấu, tiêu hao, tiêu diệt, chi viện cho lực lượng chiến đấu tại chỗ, khi cần thiết có thể chiến đấu trên địa bàn địa phương khác.","Tham gia thực hiện các biện pháp về chiến tranh thông tin, chiến tranh không gian mạng theo quy định của pháp luật, quyết định của cấp có thẩm quyền.","Phòng, chống, khắc phục hậu quả thảm họa, sự cố, thiên tai, dịch bệnh, cháy, nổ; tìm kiếm, cứu nạn, cứu hộ; bảo vệ rừng, bảo vệ môi trường."],"B",""],
[9,15,"Xây dựng lực lượng dự bị động viên phải đặt dưới sự lãnh đạo của Đảng như thế nào?",["Trực tiếp, tuyệt đối về mọi mặt.","Trực tiếp về mọi mặt.","Tuyệt đối về mọi mặt.","Toàn diện về mọi mặt."],"A",""],
[9,16,"Một trong những nhiệm vụ của lực lượng dân quân tự vệ là:",["Tuần tra canh gác bảo vệ địa phương, cơ sở; phòng chống cháy nổ bảo vệ địa phương.","Đấu tranh phòng chống tệ nạn xã hội, bài trừ mê tín dị đoan.","Chiến đấu, sẵn sàng chiến đấu trên địa bàn địa phương theo kế hoạch, phương án, khi cần có thể tăng cường cho lực lượng chiến đấu cơ động.","Sẵn sàng chiến đấu, chiến đấu và phục vụ chiến đấu để bảo vệ địa phương, cơ sở."],"D",""],
[9,17,"Nhiệm vụ của lực lượng dân quân tự vệ rộng rãi là:",["Phục vụ chiến đấu, vận chuyển tiếp tế, khắc phục hậu quả chiến đấu, bảo vệ và sơ tán nhân dân.","Chiến đấu, tiêu hao, tiêu diệt, chi viện cho lực lượng chiến đấu tại chỗ, khi cần thiết có thể chiến đấu trên địa bàn địa phương khác.","Phòng, chống, khắc phục hậu quả thảm họa, sự cố, thiên tai, dịch bệnh, cháy, nổ; tìm kiếm, cứu nạn, cứu hộ; bảo vệ rừng, bảo vệ môi trường.","Chiến đấu, sẵn sàng chiến đấu trên địa bàn địa phương theo kế hoạch, phương án, khi cần có thể tăng cường cho lực lượng chiến đấu cơ động."],"A",""],
[9,18,"Một trong những biện pháp xây dựng lực lượng dự bị động viên là:",["Giáo dục truyền thống dân tộc, tinh thần yêu nước, yêu chế độ xã hội chủ nghĩa; mục tiêu lý tưởng của Đảng.","Giáo dục chính trị, huấn luyện quân sự theo chương trình, nội dung do Bộ Quốc phòng quy định đối với lực lượng dự bị động viên.","Giáo dục truyền thống dân tộc, tinh thần yêu nước, yêu chế độ xã hội chủ nghĩa; mục tiêu lý tưởng của Đảng; con đường đi lên chủ nghĩa xã hội.","Thường xuyên củng cố, kiện toàn, bồi dưỡng cơ quan và đội ngũ cán bộ làm công tác xây dựng lực lượng dự bị động viên."],"D",""],
[9,19,"Một trong những nguyên tắc động viên công nghiệp quốc phòng là:",["Chuẩn bị và thực hành động viên công nghiệp quốc phòng phải bảo đảm cho yêu cầu thực hiện nhiệm vụ chính trị, kinh tế, xã hội.","Chuẩn bị và thực hành động viên công nghiệp quốc phòng phải bảo đảm bí mật, an toàn, tiết kiệm, hiệu quả, đúng kế hoạch, nhanh chóng tăng cường sức mạnh về mọi mặt.","Trên cơ sở kế hoạch của cấp trên, các doanh nghiệp công nghiệp lập kế hoạch động viên công nghiệp quốc phòng cho doanh nghiệp mình.","Nhà nước bảo đảm quyền, lợi ích hợp pháp của doanh nghiệp công nghiệp, người lao động trong chuẩn bị và thực hành động viên công nghiệp quốc phòng."],"D",""],
[9,20,"Một trong những nội dung thực hành động viên công nghiệp quốc phòng là:",["Bồi dưỡng chuyên môn cho người lao động và diễn tập động viên công nghiệp quốc phòng.","Tổ chức di chuyển địa điểm đối với doanh nghiệp công nghiệp phải di chuyển.","Giao chỉ tiêu động viên công nghiệp quốc phòng.","Khảo sát, lựa chọn doanh nghiệp công nghiệp có khả năng sản xuất, sửa chữa trang bị"],"B",""],
[9,21,"Cơ cấu cán bộ quân sự phân đội gồm:",["Chỉ huy trưởng, chỉ huy phó và chính trị viên.","Đại đội trưởng, chính trị viên và phó đại đội trưởng.","Chỉ huy trưởng, chính trị viên và chính trị viên phó.","Chính trị viên, chỉ huy trưởng, đại đội trưởng."],"B",""],
[9,22,"Theo Luật dân quân tự vệ 2019, một trong những nhiệm vụ của lực lượng dân quân tự vệ?",["Chiến đấu, tiêu hao, tiêu diệt, chi viện cho lực lượng chiến đấu tại chỗ, khi cần thiết có thể chiến đấu trên địa bàn địa phương khác.","Bảo vệ chính quyền, bảo vệ tính mạng, tài sản của nhân dân, tài sản của Nhà nước, làm nòng cốt cùng toàn dân đánh giặc ở địa phương, cơ sở khi có chiến tranh.","Tham gia thực hiện các biện pháp về chiến tranh thông tin, chiến tranh không gian mạng theo quy định của pháp luật, quyết định của cấp có thẩm quyền.","Chiến đấu, sẵn sàng chiến đấu trên địa bàn địa phương theo kế hoạch, phương án, khi cần có thể tăng cường cho lực lượng chiến đấu cơ động."],"C",""],
[9,23,"Động viên công nghiệp quốc phòng được chuẩn bị từ giai đoạn nào?",["Từ giai đoạn chuẩn bị chiến tranh.","Từ thời bình.","Từ chiến tranh.","Từ chiến tranh và ổn định đất nước."],"B",""],
[9,24,"Cơ quan nào ra quyết định động viên công nghiệp quốc phòng?",["Bộ Quốc Phòng.","Chính phủ.","Chủ tịch nước.","Quốc hội"],"B",""],
[9,25,"Công dân trong độ tuổi thực hiện nghĩa vụ tham gia Dân quân tự vệ cần đáp ứng đủ các tiêu chuẩn?",["Chấp hành nghiêm đường lối, quan điểm của Đảng, chính sách pháp luật của Nhà nước.","Có lý lịch rõ ràng, đủ sức khỏe thực hiện nhiệm vụ của dân quân tự vệ, không tham gia các tệ nạn xã hội.","Chấp hành nghiêm đường lối, quan điểm của Đảng, chính sách pháp luật của Nhà nước, có lí lịch rõ ràng.","Chấp hành nghiêm đường lối, quan điểm của Đảng, chính sách pháp luật của Nhà nước, có lí lịch rõ ràng, đủ sức khỏe thực hiện nhiệm vụ của dân quân tự vệ."],"D",""],
[9,26,"Một trong những biện pháp xây dựng lực lượng dân quân tự vệ trong giai đoạn hiện nay?",["Nâng cao nhận thức về chính trị, lập trường tư tưởng vững vàng, đạo đức cách mạng trong sáng.","Sẵn sàng chiến đấu trên địa bàn địa phương theo kế hoạch, phương án, khi cần có thể tăng cường cho lực lượng chiến đấu cơ động.","Tăng cường bản chất cách mạng và ý thức giác ngộ giai cấp cho cán bộ, chiến sỹ dân quân tự vệ.","Phát huy sức mạnh tổng hợp trên địa bàn để xây dựng lực lượng dân quân tự vệ."],"D",""],
[9,27,"Thời hạn thực hiện nghĩa vụ tham gia Dân quân tự vệ tại chỗ, Dân quân tự vệ cơ động, Dân quân tự vệ biển, Dân quân tự vệ binh chủng là:",["3 năm","1 năm","2 năm","4 năm"],"D",""],
[9,28,"Lực lượng Dự bị động viên được xây dựng để bổ sung cho lực lượng nào dưới đây:",["Lực lượng công an.","Lực lượng dân quân tự vệ.","Lực lượng thường trực của quân đội.","Lực lượng vũ trang địa phương."],"C",""],
[9,29,"Chọn câu trả lời đúng nhất: Xây dựng lực lượng dự bị động viên là:",["Nhiệm vụ hệ trọng trong bảo vệ Tổ quốc, bảo vệ nhân dân.","Nhiệm vụ quan trọng thường xuyên tất cả các cấp các ngành, của các cơ quan.","Nhiệm vụ trọng yếu, thường xuyên của toàn Đảng, toàn quân, toàn dân.","Nhiệm vụ quan trọng thường xuyên của của các tổ chức quân đội."],"C",""],
[9,30,"Tổ chức, biên chế đơn vị dự bị động viên phải theo nguyên tắc:",["Theo hạng, theo trình độ văn hóa và theo tuổi đời.","Theo quân hàm, theo chức vụ và theo sức khỏe.","Theo mức độ sức khỏe, theo tuổi đời và theo cư trú.","Theo trình độ chuyên nghiệp quân sự, theo hạng, theo cư trú."],"D",""],
[9,31,"Một trong những yêu cầu động viên công nghiệp quốc phòng là:",["Phải bảo đảm an toàn, bí mật.","Phải bảo đảm năng lực đã có của doanh nghiệp.","Phải bảo đảm bí mật, an toàn, tiết kiệm, hiệu quả, đúng kế hoạch.","Phải bảo đảm hiệu quả bàn giao đúng kế hoạch."],"C",""],
[9,32,"Quân nhân dự bị gồm:",["Sĩ quan dự bị và hạ sĩ quan, binh sĩ dự bị.","Sĩ quan dự bị, quân nhân chuyên nghiệp, binh sĩ dự bị.","Sĩ quan dự bị, quân nhân chuyên nghiệp dự bị và hạ sĩ quan, binh sĩ dự bị.","Quân nhân chuyên nghiệp dự bị và hạ sĩ quan, binh sĩ dự bị."],"C",""],

[9,38,"Độ tuổi của lực lượng dân quân tự vệ nòng cốt theo Luật Dân quân tự vệ năm 2019?",["Nam từ 18 tuổi đến 35; Nữ từ 18 tuổi đến hết 25 tuổi.","Nam từ 18 tuổi đến 25; Nữ từ 18 tuổi đến hết 30 tuổi.","Nam từ 18 tuổi đến 45; Nữ từ 18 tuổi đến hết 40 tuổi.","Nam từ 18 tuổi đến 40; Nữ từ 18 tuổi đến hết 35 tuổi."],"C",""],
